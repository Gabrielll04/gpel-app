<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14564A">
  <title>GPEL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314564A'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>G</text></svg>">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral">
      <div class="marca">
        <div class="marca__logo">G</div>
        <div>
          <strong>GPEL</strong>
          <span>Gestão de produção e estoque</span>
        </div>
      </div>
      <nav class="menu" id="menu-lateral"></nav>
      <div class="lateral__rodape">
        <button class="botao botao--fantasma" id="botao-atualizar" type="button">Atualizar dados</button>
        <span class="lateral__versao" id="rotulo-sincronizacao"></span>
      </div>
    </aside>

    <div class="conteudo">
      <header class="cabecalho">
        <button class="icone-botao" id="botao-voltar" type="button" hidden aria-label="Voltar">‹</button>
        <div class="cabecalho__titulo">
          <h1 id="titulo-tela">Início</h1>
          <p id="subtitulo-tela"></p>
        </div>
        <div class="cabecalho__acoes" id="acoes-tela"></div>
        <button class="icone-botao" id="botao-menu" type="button" aria-label="Mais">⋯</button>
      </header>

      <main class="tela" id="tela"></main>
    </div>

    <nav class="barra-inferior" id="barra-inferior"></nav>
  </div>

  <div class="sobreposicao" id="sobreposicao" hidden></div>
  <div class="avisos" id="avisos"></div>
  <div class="carregando" id="carregando" hidden><div class="carregando__roda"></div></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/recurso.js"></script>
  <script src="js/telas/inicio.js"></script>
  <script src="js/telas/pedidos.js"></script>
  <script src="js/telas/producao.js"></script>
  <script src="js/telas/estoque.js"></script>
  <script src="js/telas/compras.js"></script>
  <script src="js/telas/inventario.js"></script>
  <script src="js/telas/movimentos.js"></script>
  <script src="js/telas/gestao.js"></script>
  <script src="js/telas/administracao.js"></script>
  <script src="js/telas/configuracoes.js"></script>
  <script src="js/rotas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
