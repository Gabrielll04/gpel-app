/* GPEL - Histórico de movimentações (MOV_ESTOQUE).
   Tela de referência: chega-se a ela pelo item em Estoque.
   Movimentação não se edita nem se apaga — correção é uma nova movimentação. */

window.GPEL = window.GPEL || {};
GPEL.telas = GPEL.telas || {};

GPEL.telas.movimentos = (function () {
  var ui = GPEL.ui;
  var el = ui.el;
  var TABELA = 'MOV_ESTOQUE';

  var CAMPOS = [
    { nome: 'Data' },
    { nome: 'Classe' },
    { nome: 'Código Item', rotulo: 'Item' },
    { nome: 'Item' },
    { nome: 'Entrada/Saída', rotulo: 'Tipo' },
    { nome: 'Origem', ajuda: 'De onde vem essa movimentação.' },
    { nome: 'Quantidade' },
    { nome: 'Unidade' },
    { nome: 'Documento Ref.', rotulo: 'Documento', ajuda: 'NF, pedido, produção ou outra referência.' },
    { nome: 'Responsável' },
    { nome: 'Observações' }
  ];

  function registros(codigo) {
    var todos = GPEL.estado.tabela(TABELA);
    if (!codigo) return todos;
    return todos.filter(function (m) { return String(m['Código Item']).trim() === String(codigo).trim(); });
  }

  function novo(valoresIniciais) {
    GPEL.formulario.abrir({
      titulo: 'Nova movimentação',
      tabela: TABELA,
      campos: CAMPOS,
      valores: Object.assign({ Data: ui.hoje(), 'Responsável': GPEL.api.usuario() }, valoresIniciais || {}),
      rotuloSalvar: 'Registrar movimentação',
      aoSalvar: function (valores) {
        return GPEL.recurso.salvarNovo(TABELA, valores, 'Movimentação registrada.');
      }
    });
  }

  function abrirDetalhe(movimento) {
    GPEL.recurso.detalhe('Movimentação', [
      ['Data', ui.data(movimento['Data'])],
      ['Item', movimento['Item'] || movimento['Código Item']],
      ['Classe', movimento['Classe']],
      ['Tipo', ui.selo(movimento['Entrada/Saída'], movimento['Entrada/Saída'] === 'Entrada' ? 'ok' : 'atencao')],
      ['Origem', movimento['Origem']],
      ['Quantidade', ui.numero(movimento['Quantidade'], 2) + ' ' + (movimento['Unidade'] || '')],
      ['Documento', movimento['Documento Ref.'] || '—'],
      ['Responsável', movimento['Responsável'] || '—'],
      ['Observações', movimento['Observações'] || '—']
    ], []);
  }

  function cartao(movimento) {
    return ui.cartao({
      titulo: movimento['Item'] || movimento['Código Item'],
      meta: ui.data(movimento['Data']) + ' · ' + movimento['Origem'],
      selo: ui.selo(movimento['Entrada/Saída'], movimento['Entrada/Saída'] === 'Entrada' ? 'ok' : 'atencao'),
      linhas: [
        ['Quantidade', (movimento['Entrada/Saída'] === 'Entrada' ? '+' : '−') + ui.numero(movimento['Quantidade'], 2) + ' ' + (movimento['Unidade'] || '')],
        ['Documento', movimento['Documento Ref.'] || '—'],
        ['Responsável', movimento['Responsável'] || '—']
      ],
      aoClicar: function () { abrirDetalhe(movimento); }
    });
  }

  return {
    titulo: 'Movimentações',
    subtitulo: 'Histórico de entradas e saídas',
    novo: novo,
    acoes: function () { return [GPEL.recurso.botaoNovo('+ Movimentação', function () { novo(); })]; },
    render: function (parametros) {
      var codigo = parametros && parametros.codigo ? parametros.codigo : '';
      var cabecalho = null;

      if (codigo) {
        var linhaEstoque = GPEL.estado.tabela('ESTOQUE_ATUAL').filter(function (l) {
          return String(l['Código']).trim() === String(codigo).trim();
        })[0];
        if (linhaEstoque) {
          cabecalho = el('div', { class: 'indicadores', style: 'margin-bottom:16px' }, [
            ui.indicador('Item', linhaEstoque['Item'] || codigo),
            ui.indicador('Saldo atual', ui.numero(linhaEstoque['Saldo Atual'], 2) + ' ' + (linhaEstoque['Unidade'] || '')),
            ui.indicador('Entradas', ui.numero(linhaEstoque['Entradas'], 2)),
            ui.indicador('Saídas', ui.numero(linhaEstoque['Saídas'], 2))
          ]);
        }
      }

      return el('div', {}, [
        cabecalho,
        GPEL.recurso.lista({
          registros: function () { return registros(codigo); },
          vazio: 'Nenhuma movimentação encontrada.',
          placeholderBusca: 'Buscar por item, documento ou responsável…',
          busca: function (m) {
            return [m['Item'], m['Código Item'], m['Documento Ref.'], m['Responsável'], m['Origem']].join(' ');
          },
          filtros: [
            { rotulo: 'Todas', teste: null },
            { rotulo: 'Entradas', teste: function (m) { return m['Entrada/Saída'] === 'Entrada'; } },
            { rotulo: 'Saídas', teste: function (m) { return m['Entrada/Saída'] === 'Saída'; } },
            { rotulo: 'Hoje', teste: function (m) { return String(m['Data']).slice(0, 10) === ui.hoje(); } }
          ],
          ordenar: function (a, b) {
            var porData = String(b['Data']).localeCompare(String(a['Data']));
            return porData !== 0 ? porData : (b._linha || 0) - (a._linha || 0);
          },
          cartao: cartao,
          aoAbrir: abrirDetalhe,
          colunas: [
            { rotulo: 'Data', valor: function (m) { return ui.data(m['Data']); } },
            { rotulo: 'Item', valor: function (m) { return m['Item'] || m['Código Item']; } },
            { rotulo: 'Tipo', valor: function (m) { return ui.selo(m['Entrada/Saída'], m['Entrada/Saída'] === 'Entrada' ? 'ok' : 'atencao'); } },
            { rotulo: 'Origem', valor: function (m) { return m['Origem']; } },
            { rotulo: 'Qtde', numerico: true, valor: function (m) { return ui.numero(m['Quantidade'], 2); } },
            { rotulo: 'Documento', valor: function (m) { return m['Documento Ref.']; } },
            { rotulo: 'Responsável', valor: function (m) { return m['Responsável']; } }
          ]
        })
      ]);
    }
  };
})();

/* ===== js/telas/gestao.js ===== */
/* GPEL - Gestão (visão gerencial).
   Só leitura: indicadores calculados a partir do que já foi registrado. */

window.GPEL = window.GPEL || {};
GPEL.telas = GPEL.telas || {};

GPEL.telas.gestao = (function () {
  var ui = GPEL.ui;
  var el = ui.el;

  var PERIODOS = [
    { rotulo: '30 dias', dias: 30 },
    { rotulo: '90 dias', dias: 90 },
    { rotulo: 'Ano', dias: 365 },
    { rotulo: 'Tudo', dias: null }
  ];
  var periodoEscolhido = 0;

  function dentroDoPeriodo(dataTexto) {
    var dias = PERIODOS[periodoEscolhido].dias;
    if (!dias) return true;
    if (!dataTexto) return false;
    var diferenca = ui.diasEntre(dataTexto, ui.hoje());
    return diferenca !== null && diferenca >= 0 && diferenca <= dias;
  }

  function soma(lista, pegar) {
    return lista.reduce(function (total, item) { return total + (Number(pegar(item)) || 0); }, 0);
  }

  /* --------------------------------------------------------- Pedidos */

  function blocoPedidos() {
    var pedidos = GPEL.estado.tabela('PEDIDOS').filter(function (p) { return dentroDoPeriodo(p['Data']); });
    var abertos = pedidos.filter(GPEL.telas.pedidos.emAberto);
    var atrasados = pedidos.filter(GPEL.telas.pedidos.atrasado);
    var entregues = pedidos.filter(function (p) { return p['Status'] === 'Entregue'; });
    return el('div', {}, [
      el('div', { class: 'secao__titulo', texto: 'Pedidos' }),
      el('div', { class: 'indicadores' }, [
        ui.indicador('Pedidos no período', ui.numero(pedidos.length, 0)),
        ui.indicador('Em aberto', ui.numero(abertos.length, 0), ui.dinheiro(soma(abertos, function (p) { return p['Valor Total']; })) + ' a faturar'),
        ui.indicador('Atrasados', ui.numero(atrasados.length, 0), 'prazo vencido', atrasados.length > 0),
        ui.indicador('Entregues', ui.numero(entregues.length, 0), ui.dinheiro(soma(entregues, function (p) { return p['Valor Total']; })) + ' entregues')
      ])
    ]);
  }

  /* -------------------------------------------------------- Produção */

  function blocoProducao() {
    var producoes = GPEL.estado.tabela('PRODUCAO').filter(function (p) {
      return dentroDoPeriodo(p['Data']) && p['Status'] !== 'Cancelada';
    });

    var produzido = soma(producoes, function (p) { return p['Produzido']; });
    var horas = soma(producoes, function (p) { return p['Horas']; });
    var horasHomem = soma(producoes, function (p) { return (Number(p['Horas']) || 0) * (Number(p['Pessoas']) || 0); });
    var perdas = soma(producoes, function (p) { return p['Perdas (kg)']; });
    var comMeta = producoes.filter(function (p) { return (Number(p['Meta']) || 0) > 0; });
    var metaTotal = soma(comMeta, function (p) { return p['Meta']; });
    var produzidoComMeta = soma(comMeta, function (p) { return p['Produzido']; });

    var porProduto = {};
    producoes.forEach(function (p) {
      var chave = String(p['Produto'] || '');
      if (!chave) return;
      if (!porProduto[chave]) porProduto[chave] = { produzido: 0, horas: 0, perdas: 0 };
      porProduto[chave].produzido += Number(p['Produzido']) || 0;
      porProduto[chave].horas += Number(p['Horas']) || 0;
      porProduto[chave].perdas += Number(p['Perdas (kg)']) || 0;
    });

    var linhas = Object.keys(porProduto).map(function (codigo) {
      var dados = porProduto[codigo];
      return {
        produto: GPEL.estado.rotuloDe('CAD_PRODUTOS', codigo),
        produzido: dados.produzido,
        horas: dados.horas,
        perdas: dados.perdas,
        porHora: dados.horas > 0 ? dados.produzido / dados.horas : null
      };
    }).sort(function (a, b) { return b.produzido - a.produzido; });

    return el('div', {}, [
      el('div', { class: 'secao__titulo', texto: 'Produção' }),
      el('div', { class: 'indicadores' }, [
        ui.indicador('Produzido', ui.numero(produzido, 0), producoes.length + ' apontamentos'),
        ui.indicador('Produção por hora', horas > 0 ? ui.numero(produzido / horas, 2) : '—', 'média do período'),
        ui.indicador('Produção por hora/pessoa', horasHomem > 0 ? ui.numero(produzido / horasHomem, 2) : '—', 'média do período'),
        ui.indicador('Atingimento da meta', metaTotal > 0 ? ui.numero((produzidoComMeta / metaTotal) * 100, 1) + '%' : '—',
          'perdas: ' + ui.numero(perdas, 2) + ' kg', metaTotal > 0 && produzidoComMeta < metaTotal)
      ]),
      linhas.length
        ? el('div', { style: 'margin-top:12px' }, [ui.tabela([
            { rotulo: 'Produto', valor: function (l) { return l.produto; } },
            { rotulo: 'Produzido', numerico: true, valor: function (l) { return ui.numero(l.produzido, 2); } },
            { rotulo: 'Horas', numerico: true, valor: function (l) { return ui.numero(l.horas, 2); } },
            { rotulo: 'Prod./h', numerico: true, valor: function (l) { return l.porHora === null ? '—' : ui.numero(l.porHora, 2); } },
            { rotulo: 'Perdas (kg)', numerico: true, valor: function (l) { return ui.numero(l.perdas, 2); } }
          ], linhas)])
        : ui.vazio('Sem apontamentos de produção no período.')
    ]);
  }

  /* --------------------------------------------------------- Estoque */

  function blocoEstoque() {
    var criticos = GPEL.estado.tabela('ESTOQUE_ATUAL').filter(function (l) { return String(l['Status']) === 'REPOR'; });
    return el('div', {}, [
      el('div', { class: 'secao__titulo', texto: 'Estoque crítico' }),
      criticos.length
        ? ui.tabela([
            { rotulo: 'Item', valor: function (l) { return l['Item'] || l['Código']; } },
            { rotulo: 'Classe', valor: function (l) { return l['Classe']; } },
            { rotulo: 'Saldo', numerico: true, valor: function (l) { return ui.numero(l['Saldo Atual'], 2); } },
            { rotulo: 'Mínimo', numerico: true, valor: function (l) { return ui.numero(l['Estoque Mín.'], 2); } }
          ], criticos, function (l) { window.location.hash = '#/movimentos?codigo=' + encodeURIComponent(l['Código']); })
        : ui.vazio('Nenhum item abaixo do estoque mínimo.')
    ]);
  }

  /* ------------------------------------------------------------- ABC */

  /** Descobre em VENDAS_HISTORICO qual coluna é o produto e qual é o valor. */
  function colunasDeVendas(registros) {
    if (!registros.length) return null;
    var colunas = Object.keys(registros[0]).filter(function (c) { return c !== '_linha'; });
    function achar(padrao) {
      for (var i = 0; i < colunas.length; i++) if (padrao.test(colunas[i])) return colunas[i];
      return null;
    }
    var produto = achar(/produto|item/i);
    var valor = achar(/valor total/i) || achar(/valor|faturamento|total/i);
    var data = achar(/data/i);
    return produto && valor ? { produto: produto, valor: valor, data: data } : null;
  }

  function dadosABC() {
    var vendas = GPEL.estado.tabela('VENDAS_HISTORICO');
    var colunas = colunasDeVendas(vendas);

    var itens = [];
    var fonte = '';
    if (colunas) {
      fonte = 'Histórico de vendas';
      vendas.filter(function (v) { return !colunas.data || dentroDoPeriodo(v[colunas.data]); })
        .forEach(function (v) { itens.push({ chave: String(v[colunas.produto] || ''), valor: Number(v[colunas.valor]) || 0 }); });
    } else {
      fonte = 'Pedidos entregues';
      GPEL.estado.tabela('PEDIDOS')
        .filter(function (p) { return p['Status'] === 'Entregue' && dentroDoPeriodo(p['Data']); })
        .forEach(function (p) {
          itens.push({ chave: GPEL.estado.rotuloDe('CAD_PRODUTOS', p['Produto']), valor: Number(p['Valor Total']) || 0 });
        });
    }

    var agrupado = {};
    itens.forEach(function (item) {
      if (!item.chave) return;
      agrupado[item.chave] = (agrupado[item.chave] || 0) + item.valor;
    });

    var linhas = Object.keys(agrupado).map(function (chave) {
      return { produto: chave, valor: agrupado[chave] };
    }).sort(function (a, b) { return b.valor - a.valor; });

    var total = soma(linhas, function (l) { return l.valor; });
    var acumulado = 0;
    linhas.forEach(function (linha) {
      acumulado += linha.valor;
      linha.participacao = total > 0 ? linha.valor / total : 0;
      linha.acumulado = total > 0 ? acumulado / total : 0;
      linha.classe = linha.acumulado <= 0.8 ? 'A' : (linha.acumulado <= 0.95 ? 'B' : 'C');
    });

    return { fonte: fonte, linhas: linhas, total: total };
  }

  function blocoABC() {
    var abc = dadosABC();
    return el('div', {}, [
      el('div', { class: 'secao__titulo', texto: 'Curva ABC de vendas · fonte: ' + abc.fonte }),
      abc.linhas.length
        ? ui.tabela([
            { rotulo: 'Produto', valor: function (l) { return l.produto; } },
            { rotulo: 'Faturamento', numerico: true, valor: function (l) { return ui.dinheiro(l.valor); } },
            { rotulo: 'Participação', numerico: true, valor: function (l) { return ui.numero(l.participacao * 100, 1) + '%'; } },
            { rotulo: 'Acumulado', numerico: true, valor: function (l) { return ui.numero(l.acumulado * 100, 1) + '%'; } },
            { rotulo: 'Classe', valor: function (l) { return ui.selo(l.classe, l.classe === 'A' ? 'ok' : (l.classe === 'B' ? 'info' : 'neutro')); } }
          ], abc.linhas)
        : ui.vazio('Ainda não há vendas registradas para montar a curva ABC.')
    ]);
  }

  return {
    titulo: 'Gestão',
    subtitulo: 'Indicadores de pedidos, produção, estoque e vendas',
    render: function () {
      var caixa = el('div', {});

      var filtros = el('div', { class: 'filtros' }, PERIODOS.map(function (periodo, indice) {
        return el('button', {
          type: 'button',
          class: 'filtro' + (periodoEscolhido === indice ? ' ativo' : ''),
          texto: periodo.rotulo,
          onclick: function () { periodoEscolhido = indice; GPEL.rotas.redesenhar(); }
        });
      }));

      caixa.appendChild(filtros);
      caixa.appendChild(blocoPedidos());
      caixa.appendChild(blocoProducao());
      caixa.appendChild(blocoEstoque());
      caixa.appendChild(blocoABC());
      return caixa;
    }
  };
})();

/* ===== js/telas/administracao.js ===== */
/* GPEL - Administração (cadastros).
   Produtos, insumos, clientes e fornecedores. Mesma tela para os quatro:
   muda só a definição da tabela. */

window.GPEL = window.GPEL || {};
GPEL.telas = GPEL.telas || {};

GPEL.telas.administracao = (function () {
  var ui = GPEL.ui;
  var el = ui.el;

  var CADASTROS = {
    CAD_PRODUTOS: {
      rotulo: 'Produtos',
      descricao: 'Fabricação e revenda',

        { nome: 'Código', ajuda: 'Deixe em branco para o sistema criar um código.' },

    },
    CAD_INSUMOS: {
      rotulo: 'Insumos',
      descricao: 'Matéria-prima, embalagens e apoio',
      campos: [
        { nome: 'Código', ajuda: 'Deixe em branco para o sistema criar um código.' },
        { nome: 'Item', rotulo: 'Nome do insumo' },
        { nome: 'Unidade', exemplo: 'kg, un, m' }
      ],

    },

      rotulo: 'Clientes',
      descricao: 'Quem compra da GPEL',
      campos: [
        { nome: 'Código', ajuda: 'Deixe em branco para o sistema criar um código.' },
        { nome: 'Razão Social', rotulo: 'Nome / razão social' }
      ],
      colunas: ['Código', 'Razão Social']
    },
    CAD_FORNECEDORES: {
      rotulo: 'Fornecedores',
      descricao: 'De quem a GPEL compra',
      campos: [
        { nome: 'Código', ajuda: 'Deixe em branco para o sistema criar um código.' },
        { nome: 'Razão Social', rotulo: 'Nome / razão social' }
      ],
      colunas: ['Código', 'Razão Social']
    }
  };

  var cadastroAtual = 'CAD_PRODUTOS';

  function definicao() { return GPEL.estado.definicao(cadastroAtual) || {}; }

  function novo() {
    var config = CADASTROS[cadastroAtual];
    GPEL.formulario.abrir({
      titulo: 'Novo em ' + config.rotulo,
      tabela: cadastroAtual,
      campos: config.campos,
      valores: {},
      aoSalvar: function (valores) {
        return GPEL.recurso.salvarNovo(cadastroAtual, valores, 'Cadastro criado.');
      }
    });
  }

  function editar(registro) {
    ui.fecharPainel();
    var config = CADASTROS[cadastroAtual];
    var chave = definicao().chave;
    GPEL.formulario.abrir({
      titulo: 'Editar cadastro',
      tabela: cadastroAtual,
      campos: config.campos.map(function (campo) {
        return campo.nome === chave ? Object.assign({}, campo, { somenteLeitura: true, ajuda: null }) : campo;
      }),
      valores: registro,
      aoSalvar: function (valores) {
        return GPEL.recurso.salvarEdicao(cadastroAtual, registro[chave], valores, 'Cadastro atualizado.');
      }
    });
  }

  function excluir(registro) {

    ui.fecharPainel();
    ui.confirmar('Excluir cadastro', 'Deseja excluir "' + (registro[definicao().rotulo] || registro[chave]) + '"? Cadastros já usados em pedidos, compras ou movimentações não podem ser excluídos.', 'Excluir', true)
      .then(function (confirmado) {

        ui.carregando(true);
        GPEL.api.excluir(cadastroAtual, registro[chave])
          .then(function () {
            ui.aviso('Cadastro excluído.', 'ok');
            return GPEL.estado.atualizar();
          })
          .catch(function (erro) { ui.aviso(erro.message, 'erro'); })
          .finally(function () { ui.carregando(false); });
      });
  }

  function abrirDetalhe(registro) {
    var config = CADASTROS[cadastroAtual];
    GPEL.recurso.detalhe(String(registro[definicao().rotulo] || ''), config.colunas.map(function (coluna) {
      return [coluna, String(registro[coluna] || '—')];
    }), [
      el('button', { class: 'botao botao--perigo', type: 'button', texto: 'Excluir', onclick: function () { excluir(registro); } }),
      el('button', { class: 'botao', type: 'button', texto: 'Editar', onclick: function () { editar(registro); } })
    ]);
  }

  return {
    titulo: 'Administração',
    subtitulo: 'Cadastros de produtos, insumos, clientes e fornecedores',
    acoes: function () { return [GPEL.recurso.botaoNovo('+ Cadastro', novo)]; },
    render: function () {
      var caixa = el('div', {});

      caixa.appendChild(el('div', { class: 'filtros' }, Object.keys(CADASTROS).map(function (nome) {
        return el('button', {
          type: 'button',
          class: 'filtro' + (cadastroAtual === nome ? ' ativo' : ''),
          texto: CADASTROS[nome].rotulo,
          onclick: function () { cadastroAtual = nome; GPEL.rotas.redesenhar(); }
        });
      })));

      var config = CADASTROS[cadastroAtual];
      caixa.appendChild(el('p', { class: 'cartao__meta', style: 'margin-bottom:12px', texto: config.descricao }));

      caixa.appendChild(GPEL.recurso.lista({
        registros: function () { return GPEL.estado.tabela(cadastroAtual); },
        vazio: 'Nenhum registro em ' + config.rotulo + '.',
        placeholderBusca: 'Buscar…',
        busca: function (r) { return config.colunas.map(function (c) { return r[c]; }).join(' '); },
        ordenar: function (a, b) {
          return String(a[definicao().rotulo] || '').localeCompare(String(b[definicao().rotulo] || ''), 'pt-BR');
        },
        cartao: function (registro) {
          return ui.cartao({
            titulo: String(registro[definicao().rotulo] || registro[definicao().chave]),
            meta: 'Código: ' + registro[definicao().chave],
            selo: cadastroAtual === 'CAD_PRODUTOS' ? ui.selo(registro['Tipo'], 'neutro') : null,
            linhas: registro['Unidade'] ? [['Unidade', registro['Unidade']]] : [],
            aoClicar: function () { abrirDetalhe(registro); }
          });
        },
        aoAbrir: abrirDetalhe,
        colunas: config.colunas.map(function (coluna) {
          return { rotulo: coluna, valor: function (r) { return r[coluna]; } };
        })
      }));

      return caixa;
    }
  };
})();

/* ===== js/telas/configuracoes.js ===== */
/* GPEL - Configurações.
   Onde se informa o endereço do servidor (Web App do Apps Script),
   a senha (se houver) e o nome de quem está usando o aplicativo. */

window.GPEL = window.GPEL || {};
GPEL.telas = GPEL.telas || {};

GPEL.telas.configuracoes = (function () {
  var ui = GPEL.ui;
  var el = ui.el;

  function campo(rotulo, valor, ajuda, tipo) {
    var entrada = el('input', { type: tipo || 'text' });
    entrada.value = valor || '';
    var caixa = el('div', { class: 'campo' }, [
      el('label', { texto: rotulo }),
      entrada,
      ajuda ? el('div', { class: 'campo__ajuda', texto: ajuda }) : null
    ]);
    return { caixa: caixa, entrada: entrada };
  }

  return {
    titulo: 'Configurações',
    subtitulo: 'Sua conta e o acesso ao aplicativo',
    render: function () {
      var marcaApenas = ui.marca();

      /* Servido pelo Apps Script, não há endereço nem senha para configurar:
         quem identifica a pessoa é o login do Google. */
      if (GPEL.api.dentroDoAppsScript()) {
        var quem = (GPEL.estado.dados && GPEL.estado.dados.usuario) || {};
        return el('div', { class: 'formulario' }, [
          marcaApenas,
          el('div', { class: 'cartao' }, [
            el('div', { class: 'cartao__titulo', texto: 'Sua conta' }),
            el('div', { class: 'cartao__linhas' }, [
              el('div', { class: 'cartao__linha' }, [
                el('span', { texto: 'Conectada como' }),
                el('span', { texto: quem.email || 'conta Google' })
              ]),
              el('div', { class: 'cartao__linha' }, [
                el('span', { texto: 'Acesso' }),
                el('span', {}, [ui.selo(quem.listaAtiva ? 'restrito por e-mail' : 'liberado', quem.listaAtiva ? 'ok' : 'atencao')])
              ])
            ]),
            el('div', { class: 'campo__ajuda', style: 'margin-top:10px', texto: quem.listaAtiva
              ? 'Só os e-mails autorizados abrem este aplicativo. Suas movimentações são assinadas com esta conta.'
              : 'Nenhuma lista de e-mails foi definida no Apps Script: quem conseguir abrir o endereço entra.' })
          ]),
          el('div', { class: 'cartao' }, [
            el('div', { class: 'cartao__titulo', texto: 'Quem pode usar o aplicativo' }),
            el('p', { class: 'campo__ajuda', style: 'margin-top:8px', texto:
              'Para incluir ou tirar alguém: abra a planilha, Extensões > Apps Script, edite a lista USUARIOS_AUTORIZADOS em Config.gs, compartilhe a planilha com o novo e-mail e publique uma nova versão do aplicativo.' })
          ])
        ]);
      }

      var url = campo('Endereço do aplicativo (Web App)', GPEL.api.url(),
        'Cole aqui a URL que termina em /exec, gerada ao publicar o Apps Script.', 'url');
      var token = campo('Senha de acesso', GPEL.api.token(),
        'Só é necessária se você preencheu TOKEN_ACESSO no Apps Script.', 'password');
      var usuario = campo('Seu nome', GPEL.api.usuario(),
        'Usado como responsável nas movimentações de estoque.');

      var situacao = el('div', { class: 'cartao' }, [
        el('div', { class: 'cartao__titulo', texto: 'Situação da conexão' }),
        el('div', { class: 'cartao__meta', id: 'situacao-conexao', texto: GPEL.api.configurada() ? 'Endereço configurado.' : 'Endereço ainda não informado.' })
      ]);

      var botoes = el('div', { class: 'formulario__acoes' }, [
        el('button', {
          class: 'botao botao--fantasma', type: 'button', texto: 'Testar conexão',
          onclick: function () {
            GPEL.api.definirUrl(url.entrada.value);
            GPEL.api.definirToken(token.entrada.value);
            ui.carregando(true);
            GPEL.api.ping()
              .then(function (resposta) {
                situacao.querySelector('#situacao-conexao').textContent = 'Conectado: ' + resposta.mensagem;
                ui.aviso('Conexão funcionando.', 'ok');
              })
              .catch(function (erro) {
                situacao.querySelector('#situacao-conexao').textContent = 'Falhou: ' + erro.message;
                ui.aviso(erro.message, 'erro');
              })
              .finally(function () { ui.carregando(false); });
          }
        }),
        el('button', {
          class: 'botao', type: 'button', texto: 'Salvar',
          onclick: function () {
            GPEL.api.definirUrl(url.entrada.value);
            GPEL.api.definirToken(token.entrada.value);
            GPEL.api.definirUsuario(usuario.entrada.value);
            ui.aviso('Configurações salvas.', 'ok');
            GPEL.estado.atualizar().catch(function (erro) { ui.aviso(erro.message, 'erro'); });
          }
        })
      ]);

      var ajuda = el('div', { class: 'cartao' }, [
        el('div', { class: 'cartao__titulo', texto: 'Como publicar o aplicativo' }),
        el('ol', { style: 'margin:10px 0 0;padding-left:18px;color:var(--texto-suave);font-size:13.5px;line-height:1.7' }, [
          el('li', { texto: 'Abra a planilha da GPEL e vá em Extensões > Apps Script.' }),
          el('li', { texto: 'Cole os arquivos da pasta apps-script e salve.' }),
          el('li', { texto: 'Execute uma vez a função instalarPlanilha, autorizando o acesso.' }),
          el('li', { texto: 'Clique em Implantar > Nova implantação > Aplicativo da Web.' }),
          el('li', { texto: 'Em "Executar como" escolha Eu; em "Quem pode acessar" escolha Qualquer pessoa.' }),
          el('li', { texto: 'Copie a URL gerada e cole no campo acima.' })
        ])
      ]);

      return el('div', { class: 'formulario' }, [marcaApenas, situacao, url.caixa, token.caixa, usuario.caixa, botoes, ajuda]);
    }
  };
})();

/* ===== js/rotas.js ===== */
/* GPEL - navegação por endereço (#/pedidos, #/estoque?codigo=INS001, ...). */

window.GPEL = window.GPEL || {};

GPEL.rotas = (function () {
  var ui = GPEL.ui;
  var el = ui.el;

  /* Menu principal: uso diário (barra inferior no celular). */
  var PRINCIPAIS = [
    { rota: 'inicio', rotulo: 'Início', icone: 'inicio' },
    { rota: 'pedidos', rotulo: 'Pedidos', icone: 'pedidos' },
    { rota: 'producao', rotulo: 'Produção', icone: 'producao' },
    { rota: 'estoque', rotulo: 'Estoque', icone: 'estoque' },
    { rota: 'compras', rotulo: 'Compras', icone: 'compras' }
  ];

  /* Menu secundário: uso esporádico / gerencial. */
  var SECUNDARIAS = [
    { rota: 'inventario', rotulo: 'Inventário', icone: 'inventario' },
    { rota: 'gestao', rotulo: 'Gestão', icone: 'gestao' },
    { rota: 'administracao', rotulo: 'Administração', icone: 'administracao' },
    { rota: 'configuracoes', rotulo: 'Configurações', icone: 'configuracoes' }
  ];

  /* Telas de referência: abertas por navegação, sem item de menu próprio. */
  var REFERENCIA = ['movimentos'];

  var atual = { rota: 'inicio', parametros: {} };

  function lerEndereco() {
    var hash = window.location.hash.replace(/^#\/?/, '') || 'inicio';
    var partes = hash.split('?');
    var rota = partes[0] || 'inicio';
    var parametros = {};
    if (partes[1]) {
      partes[1].split('&').forEach(function (par) {
        var pedaco = par.split('=');
        if (pedaco[0]) parametros[decodeURIComponent(pedaco[0])] = decodeURIComponent(pedaco[1] || '');
      });
    }
    if (!GPEL.telas[rota]) rota = 'inicio';
    return { rota: rota, parametros: parametros };
  }

  function desenharMenus() {
    var lateral = document.getElementById('menu-lateral');
    ui.limpar(lateral);

    function itemLateral(item) {
      return el('a', { href: '#/' + item.rota, class: atual.rota === item.rota ? 'ativo' : '' }, [
        ui.icone(item.icone),
        el('span', { texto: item.rotulo })
      ]);
    }

    PRINCIPAIS.forEach(function (item) { lateral.appendChild(itemLateral(item)); });
    lateral.appendChild(el('div', { class: 'menu__separador', texto: 'Gerencial' }));
    SECUNDARIAS.forEach(function (item) { lateral.appendChild(itemLateral(item)); });

    var barra = document.getElementById('barra-inferior');
    ui.limpar(barra);
    PRINCIPAIS.forEach(function (item) {
      barra.appendChild(el('a', { href: '#/' + item.rota, class: atual.rota === item.rota ? 'ativo' : '' }, [
        ui.icone(item.icone),
        el('span', { texto: item.rotulo })
      ]));
    });
  }

  function abrirMenuSecundario() {
    var lista = el('div', { class: 'formulario' }, SECUNDARIAS.map(function (item) {
      return el('button', {
        class: 'botao botao--secundario botao--bloco', type: 'button', texto: item.rotulo,
        onclick: function () { ui.fecharPainel(); window.location.hash = '#/' + item.rota; }
      });
    }).concat([
      el('button', {
        class: 'botao botao--fantasma botao--bloco', type: 'button', texto: 'Atualizar dados',
        onclick: function () {
          ui.fecharPainel();
          GPEL.estado.atualizar().catch(function (erro) { ui.aviso(erro.message, 'erro'); });
        }
      })
    ]));
    ui.abrirPainel('Mais', lista);
  }

  function desenhar() {
    var tela = GPEL.telas[atual.rota];
    if (!tela) return;

    document.getElementById('titulo-tela').textContent = tela.titulo;
    document.getElementById('subtitulo-tela').textContent = tela.subtitulo || '';

    var acoes = ui.limpar(document.getElementById('acoes-tela'));
    if (tela.acoes && GPEL.api.configurada()) {
      tela.acoes().forEach(function (botao) { acoes.appendChild(botao); });
    }

    var voltar = document.getElementById('botao-voltar');
    voltar.hidden = REFERENCIA.indexOf(atual.rota) === -1;

    var area = ui.limpar(document.getElementById('tela'));

    if (!GPEL.api.configurada() && atual.rota !== 'configuracoes') {
      area.appendChild(ui.marca());
      area.appendChild(el('div', { class: 'aviso-configuracao' }, [
        el('strong', { texto: 'Falta conectar o aplicativo à planilha. ' }),
        el('span', { texto: 'Abra Configurações e informe o endereço publicado no Apps Script.' })
      ]));
      area.appendChild(el('button', {
        class: 'botao botao--bloco', type: 'button', texto: 'Abrir Configurações',
        onclick: function () { window.location.hash = '#/configuracoes'; }
      }));
      desenharMenus();
      return;
    }

    area.appendChild(tela.render(atual.parametros));
    desenharMenus();
    window.scrollTo(0, 0);
  }

  function aoMudarEndereco() {
    ui.fecharPainel();
    atual = lerEndereco();
    desenhar();
  }

  /* Servido pelo Apps Script, o aplicativo roda dentro de um quadro (iframe).
     Tratar o clique por conta própria faz a navegação se comportar igual nos
     dois modos, hospedado fora ou dentro do Google. */
  function aoClicarEmLink(evento) {
    var alvo = evento.target;
    while (alvo && alvo.tagName !== 'A') alvo = alvo.parentNode;
    if (!alvo) return;
    var destino = alvo.getAttribute('href') || '';
    if (destino.indexOf('#/') !== 0) return;
    evento.preventDefault();
    if (window.location.hash === destino) aoMudarEndereco();
    else window.location.hash = destino;
  }

  function iniciar() {
    document.addEventListener('click', aoClicarEmLink);
    window.addEventListener('hashchange', aoMudarEndereco);
    document.getElementById('botao-menu').addEventListener('click', abrirMenuSecundario);
    document.getElementById('botao-voltar').addEventListener('click', function () { window.history.back(); });
    atual = lerEndereco();
    desenhar();
  }

  return {
    iniciar: iniciar,
    redesenhar: desenhar,
    get atual() { return atual; }
  };
})();

/* ===== js/app.js ===== */
/* GPEL - inicialização do aplicativo. */

(function () {
  var ui = GPEL.ui;

  function mostrarSincronizacao() {
    var rotulo = document.getElementById('rotulo-sincronizacao');
    if (!rotulo) return;
    var quando = GPEL.estado.carregadoEm;
    var partes = [];
    var quem = GPEL.estado.dados && GPEL.estado.dados.usuario;
    if (quem && quem.email) partes.push(quem.email);
    if (quando) partes.push('atualizado às ' + quando.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
    rotulo.textContent = partes.join(' · ');
  }

  /* Tela mostrada quando o endereço atual não consegue mais falar com a
     planilha porque o aplicativo passou a exigir login do Google.
     Acontece com quem guardou o link antigo (GitHub Pages, Cloudflare). */
  function avisarParaAbrirNoGoogle() {
    var endereco = GPEL.api.url();
    var area = ui.limpar(document.getElementById('tela'));
    document.getElementById('titulo-tela').textContent = 'GPEL';
    document.getElementById('subtitulo-tela').textContent = 'Abrir pelo endereço certo';
    ui.limpar(document.getElementById('acoes-tela'));

    area.appendChild(ui.marca());
    area.appendChild(ui.el('div', { class: 'aviso-configuracao' }, [
      ui.el('strong', { texto: 'O aplicativo mudou de endereço. ' }),
      ui.el('span', { texto: 'Agora ele pede login com a sua conta Google, e por isso precisa ser aberto pelo endereço do próprio Google. Este atalho antigo não funciona mais.' })
    ]));
    if (endereco) {
      area.appendChild(ui.el('a', {
        class: 'botao botao--bloco', href: endereco, target: '_top', rel: 'noopener',
        texto: 'Abrir o aplicativo'
      }));
      area.appendChild(ui.el('p', {
        class: 'campo__ajuda', style: 'margin-top:12px;text-align:center',
        texto: 'Dica: depois de abrir, use o menu do navegador e escolha "Adicionar à tela inicial" para trocar o atalho antigo.'
      }));
    }
  }

  /* Abre a tela o quanto antes: se houver dados guardados no aparelho, a
     interface aparece na hora e a busca ao servidor termina por trás. */
  function abrir() {
    if (!GPEL.api.configurada()) {
      GPEL.rotas.iniciar();
      if (window.location.hash.indexOf('configuracoes') === -1) {
        ui.aviso('Informe o endereço do servidor em Configurações.', 'erro');
      }
      return;
    }

    var abertura = GPEL.estado.iniciar();
    if (abertura.temCache) {
      GPEL.rotas.iniciar();
      mostrarSincronizacao();
    }

    abertura.promessa
      .then(function () {
        if (abertura.temCache) GPEL.rotas.redesenhar();
        else GPEL.rotas.iniciar();
        mostrarSincronizacao();
      })
      .catch(function (erro) {
        if (!abertura.temCache) GPEL.rotas.iniciar();
        if (erro.precisaAbrirNoGoogle) avisarParaAbrirNoGoogle();
        else ui.aviso(erro.message, 'erro');
      });
  }

  document.getElementById('botao-atualizar').addEventListener('click', function () {
    GPEL.estado.atualizar()
      .then(mostrarSincronizacao)
      .catch(function (erro) {
        if (erro.precisaAbrirNoGoogle) avisarParaAbrirNoGoogle();
        else ui.aviso(erro.message, 'erro');
      });
  });

  // Redesenha ao virar o aparelho ou redimensionar (cartões <-> tabela).
  var larguraAnterior = window.innerWidth >= 900;
  window.addEventListener('resize', function () {
    var agora = window.innerWidth >= 900;
    if (agora !== larguraAnterior) {
      larguraAnterior = agora;
      GPEL.rotas.redesenhar();
    }
  });

  abrir();
})();

  </script>
