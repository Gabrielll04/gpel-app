<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14564A">
  <title>GPEL</title>
  <meta name="apple-mobile-web-app-title" content="GPEL">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
/* GPEL - identidade visual e componentes.
   Um único arquivo, organizado por blocos, para facilitar a manutenção. */

:root {
  --verde: #14564A;
  --verde-claro: #1F7A63;
  --verde-suave: #E6F1ED;
  --grafite: #16212B;
  --texto: #1D2733;
  --texto-suave: #63707E;
  --linha: #E2E7EC;
  --fundo: #F3F5F7;
  --branco: #FFFFFF;
  --ok: #167D4E;
  --ok-suave: #E4F4EC;
  --atencao: #9A6300;
  --atencao-suave: #FDF1DC;
  --erro: #B32318;
  --erro-suave: #FDECEA;
  --info: #17547E;
  --info-suave: #E5F0F8;
  --raio: 14px;
  --raio-p: 9px;
  --sombra: 0 1px 2px rgba(22, 33, 43, .07), 0 6px 18px rgba(22, 33, 43, .06);
  --lateral: 248px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--fundo);
  color: var(--texto);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; }

/* ----------------------------------------------------------- Estrutura */

.app { min-height: 100%; }

.lateral { display: none; }

.conteudo {
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}

.cabecalho {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  padding-top: calc(14px + env(safe-area-inset-top));
  background: var(--verde);
  color: #fff;
}

/* A logo fica num quadro branco: o original tem fundo branco e o
   cabeçalho é verde escuro. */
.cabecalho__marca {
  height: 38px;
  width: auto;
  background: #fff;
  border-radius: 8px;
  padding: 3px 4px;
  flex: none;
}

.cabecalho__titulo { flex: 1; min-width: 0; }
.cabecalho__titulo h1 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cabecalho__titulo p { font-size: 12.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cabecalho__acoes { display: flex; gap: 8px; }

.icone-botao {
  border: 0;
  background: rgba(255, 255, 255, .16);
  color: #fff;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.icone-botao:active { transform: scale(.96); }

.tela { padding: 16px; max-width: 1080px; margin: 0 auto; }

/* --------------------------------------------------------- Navegação */

.barra-inferior {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--branco);
  border-top: 1px solid var(--linha);
  padding-bottom: env(safe-area-inset-bottom);
}

.barra-inferior a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 2px 8px;
  text-decoration: none;
  color: var(--texto-suave);
  font-size: 11px;
}
.barra-inferior a svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.barra-inferior a.ativo { color: var(--verde); font-weight: 600; }

/* -------------------------------------------------------- Componentes */

.cartao {
  background: var(--branco);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  padding: 14px;
  margin-bottom: 12px;
}
.cartao--vazio { text-align: center; color: var(--texto-suave); padding: 28px 16px; }
.cartao__topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.cartao__titulo { font-weight: 640; font-size: 15.5px; }
.cartao__meta { color: var(--texto-suave); font-size: 12.5px; margin-top: 2px; }
.cartao__linhas { margin-top: 10px; display: grid; gap: 4px; }
.cartao__linha { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.cartao__linha span:first-child { color: var(--texto-suave); }
.cartao__linha span:last-child { font-weight: 560; text-align: right; }
.cartao--clicavel { cursor: pointer; }
.cartao--clicavel:active { transform: scale(.995); }

.secao { margin: 0 0 10px; }
.secao__titulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-suave); font-weight: 650; margin: 18px 0 8px; }

.selo {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 620;
  white-space: nowrap;
  background: var(--info-suave);
  color: var(--info);
}
.selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.selo--ok { background: var(--ok-suave); color: var(--ok); }
.selo--atencao { background: var(--atencao-suave); color: var(--atencao); }
.selo--erro { background: var(--erro-suave); color: var(--erro); }
.selo--neutro { background: #EDF0F3; color: var(--texto-suave); }

.botao {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  border-radius: var(--raio-p);
  padding: 11px 16px;
  font-weight: 620;
  font-size: 14.5px;
  background: var(--verde);
  color: #fff;
  cursor: pointer;
  text-decoration: none; /* o botão também é usado como link */
}
.botao:active { transform: scale(.985); }
.botao[disabled] { opacity: .5; cursor: not-allowed; }
.botao--secundario { background: var(--verde-suave); color: var(--verde); }
.botao--fantasma { background: transparent; color: var(--verde); border: 1px solid var(--linha); }
.botao--perigo { background: var(--erro-suave); color: var(--erro); }
.botao--bloco { width: 100%; }
.botao--pequeno { padding: 7px 12px; font-size: 13px; }

.acoes-rapidas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.acao-rapida {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 14px;
  border-radius: var(--raio);
  border: 1px solid var(--linha);
  background: var(--branco);
  box-shadow: var(--sombra);
  text-decoration: none;
  color: var(--texto);
}
.acao-rapida__icone {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--verde-suave);
  color: var(--verde);
}
.acao-rapida__icone svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.acao-rapida strong { font-size: 14.5px; }
.acao-rapida span { font-size: 12.5px; color: var(--texto-suave); }

.indicadores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.indicador {
  background: var(--branco);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  padding: 13px 14px;
  box-shadow: var(--sombra);
}
.indicador__rotulo { font-size: 12px; color: var(--texto-suave); }
.indicador__valor { font-size: 22px; font-weight: 680; letter-spacing: -.02em; margin-top: 2px; }
.indicador__nota { font-size: 12px; color: var(--texto-suave); }
.indicador--alerta .indicador__valor { color: var(--erro); }

.filtros { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
.filtros::-webkit-scrollbar { display: none; }
.filtro {
  border: 1px solid var(--linha);
  background: var(--branco);
  color: var(--texto-suave);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}
.filtro.ativo { background: var(--verde); border-color: var(--verde); color: #fff; font-weight: 600; }

.busca { position: relative; margin-bottom: 12px; }
.busca input {
  width: 100%;
  padding: 11px 13px;
  border-radius: var(--raio-p);
  border: 1px solid var(--linha);
  background: var(--branco);
  font-size: 15px;
}

/* ---------------------------------------------------------- Formulário */

.formulario { display: grid; gap: 14px; }
.campo { display: grid; gap: 6px; }
.campo > label { font-size: 13px; font-weight: 600; color: var(--texto-suave); }
.campo input, .campo select, .campo textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--linha);
  border-radius: var(--raio-p);
  background: var(--branco);
  font-size: 16px; /* 16px evita o zoom automático no iPhone */
  color: var(--texto);
}
.campo textarea { min-height: 78px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus {
  outline: 2px solid var(--verde-claro);
  outline-offset: -1px;
  border-color: var(--verde-claro);
}
.campo--erro input, .campo--erro select, .campo--erro textarea { border-color: var(--erro); }
.campo__ajuda { font-size: 12px; color: var(--texto-suave); }
.campo__erro { font-size: 12.5px; color: var(--erro); font-weight: 600; }
.campo--calculado .campo__valor {
  padding: 11px 12px;
  border-radius: var(--raio-p);
  background: var(--verde-suave);
  font-weight: 650;
  color: var(--verde);
}
.formulario__acoes { display: flex; gap: 10px; margin-top: 4px; }
.formulario__acoes .botao { flex: 1; }

/* -------------------------------------------------------------- Modal */

.sobreposicao {
  position: fixed;
  inset: 0;
  background: rgba(16, 24, 32, .45);
  z-index: 40;
}

.painel {
  position: fixed;
  z-index: 50;
  left: 0; right: 0; bottom: 0;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--branco);
  border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 30px rgba(16, 24, 32, .18);
  animation: subir .18s ease-out;
}
@keyframes subir { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
.painel__topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.painel__topo h2 { font-size: 17px; }
.painel__fechar { border: 0; background: #EDF0F3; width: 32px; height: 32px; border-radius: 50%; font-size: 17px; cursor: pointer; color: var(--texto-suave); }

/* ------------------------------------------------------------ Avisos */

.avisos { position: fixed; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 60; display: grid; gap: 8px; pointer-events: none; }
.aviso {
  background: var(--grafite);
  color: #fff;
  padding: 12px 14px;
  border-radius: var(--raio-p);
  font-size: 14px;
  box-shadow: var(--sombra);
  animation: subir .18s ease-out;
}
.aviso--ok { background: var(--ok); }
.aviso--erro { background: var(--erro); }

/* [hidden] precisa vencer o display abaixo, senão a camada continua na frente. */
.carregando[hidden], .sobreposicao[hidden] { display: none; }
.carregando { position: fixed; inset: 0; background: rgba(243, 245, 247, .6); display: grid; place-items: center; z-index: 70; }
.carregando__roda { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--verde-suave); border-top-color: var(--verde); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------ Tabela */

.tabela-envolve { overflow-x: auto; background: var(--branco); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); }
table.tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tabela th, table.tabela td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--linha); white-space: nowrap; }
table.tabela th { background: #FAFBFC; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); position: sticky; top: 0; }
table.tabela tbody tr:last-child td { border-bottom: 0; }
table.tabela tbody tr.clicavel:hover { background: var(--verde-suave); cursor: pointer; }
.numero { text-align: right; font-variant-numeric: tabular-nums; }

.barra-proporcao { height: 6px; border-radius: 3px; background: #EDF0F3; overflow: hidden; }
.barra-proporcao > div { height: 100%; background: var(--verde-claro); }

.marca-completa { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 6px 0 2px; }
.marca-completa img { width: 132px; height: auto; }
.marca-completa span { font-size: 12.5px; color: var(--texto-suave); }

.aviso-configuracao { background: var(--atencao-suave); border: 1px solid #F2DDB4; color: var(--atencao); border-radius: var(--raio); padding: 14px; margin-bottom: 14px; font-size: 13.5px; }

.lista-detalhe { display: grid; gap: 8px; margin-bottom: 16px; }
.lista-detalhe div { display: flex; justify-content: space-between; gap: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--linha); font-size: 14px; }
.lista-detalhe span:first-child { color: var(--texto-suave); }
.lista-detalhe span:last-child { font-weight: 600; text-align: right; }

/* ------------------------------------------------------------ Desktop */

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: var(--lateral) 1fr; min-height: 100vh; }
  .barra-inferior { display: none; }
  .conteudo { padding-bottom: 32px; }

  .lateral {
    display: flex;
    flex-direction: column;
    background: var(--grafite);
    color: #fff;
    padding: 20px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .marca { display: grid; gap: 8px; margin-bottom: 22px; justify-items: start; }
  .marca__logo { width: 124px; height: auto; background: #fff; border-radius: 10px; padding: 8px 10px; }
  .marca__descricao { font-size: 11.5px; opacity: .65; line-height: 1.3; }

  .menu { display: grid; gap: 3px; }
  .menu a {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: var(--raio-p);
    color: rgba(255, 255, 255, .72); text-decoration: none; font-size: 14px;
  }
  .menu a svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .menu a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
  .menu a.ativo { background: var(--verde-claro); color: #fff; font-weight: 600; }
  .menu__separador { margin: 14px 0 6px; padding: 0 12px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .45; }

  .lateral__rodape { margin-top: auto; display: grid; gap: 8px; }
  .lateral__rodape .botao--fantasma { color: #fff; border-color: rgba(255, 255, 255, .2); }
  .lateral__versao { font-size: 11px; opacity: .5; text-align: center; }

  .cabecalho { background: var(--branco); color: var(--texto); border-bottom: 1px solid var(--linha); padding: 16px 28px; }
  .cabecalho__marca { display: none; } /* no computador, a marca já está no menu lateral */
  .cabecalho__titulo h1 { font-size: 22px; }
  .cabecalho__titulo p { color: var(--texto-suave); opacity: 1; }
  .icone-botao { background: #EDF0F3; color: var(--texto-suave); }
  .tela { padding: 24px 28px 40px; max-width: 1180px; margin: 0; }

  .acoes-rapidas { grid-template-columns: repeat(3, 1fr); }
  .indicadores { grid-template-columns: repeat(4, 1fr); }
  .painel { left: 50%; right: auto; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: min(560px, 92vw); border-radius: var(--raio); max-height: 86vh; }
  @keyframes subir { from { opacity: .4; } to { opacity: 1; } }
  .avisos { left: auto; right: 24px; bottom: 24px; width: 340px; }
}

  </style>
</head>

/* ===== js/config.js ===== */
/* GPEL - configuração do aplicativo web.
   Tudo o que muda de ambiente fica aqui. */

window.GPEL = window.GPEL || {};

GPEL.config = {
  /* URL do Web App publicado no Apps Script.
     Deixe vazio para que a própria usuária cole a URL na tela Configurações,
     ou preencha aqui para já sair configurado para todo mundo.
     Exemplo: 'https://script.google.com/macros/s/AKfycb.../exec' */
  URL_API_PADRAO: 'https://script.google.com/macros/s/AKfycbwO2ftFW5S_AvmsafYVY0GjK9gJkX_WqJmlWDStyX2VRDsq5u80zy0Io2HdOqlZKh3WYg/exec',

  /* Senha simples, só se você tiver preenchido TOKEN_ACESSO no Apps Script. */
  TOKEN_PADRAO: '',

  /* Chaves usadas para guardar preferências no próprio aparelho. */
  CHAVE_URL: 'gpel.urlApi',
  CHAVE_TOKEN: 'gpel.token',
  CHAVE_USUARIO: 'gpel.usuario'
};

/* Leitura/escrita das preferências locais, com proteção para navegadores
   que bloqueiam o armazenamento (aba anônima, por exemplo). */
GPEL.preferencias = {
  ler: function (chave, padrao) {
    try {
      var valor = window.localStorage.getItem(chave);
      return valor === null ? padrao : valor;
    } catch (e) {
      return padrao;
    }
  },
  gravar: function (chave, valor) {
    try {
      window.localStorage.setItem(chave, valor);
    } catch (e) {
      /* sem armazenamento: segue sem guardar */
    }
  }
};

/* ===== js/ui.js ===== */
/* GPEL - utilidades de interface: criação de elementos, formatação,
   avisos, painéis e blocos visuais reaproveitados pelas telas. */

window.GPEL = window.GPEL || {};

GPEL.ui = (function () {

  /* ------------------------------------------------------- elementos */

  /** Cria um elemento. Ex.: el('div', { class: 'cartao' }, ['texto']) */
  function el(tag, atributos, filhos) {
    var elemento = document.createElement(tag);
    atributos = atributos || {};
    Object.keys(atributos).forEach(function (chave) {
      var valor = atributos[chave];
      if (valor === null || valor === undefined || valor === false) return;
      if (chave === 'class') elemento.className = valor;
      else if (chave === 'html') elemento.innerHTML = valor;
      else if (chave === 'texto') elemento.textContent = valor;
      else if (chave.indexOf('on') === 0) elemento.addEventListener(chave.slice(2), valor);
      else if (valor === true) elemento.setAttribute(chave, '');
      else elemento.setAttribute(chave, valor);
    });
    (filhos || []).forEach(function (filho) {
      if (filho === null || filho === undefined || filho === false) return;
      elemento.appendChild(typeof filho === 'string' ? document.createTextNode(filho) : filho);
    });
    return elemento;
  }

  function limpar(elemento) {
    while (elemento.firstChild) elemento.removeChild(elemento.firstChild);
    return elemento;
  }

  /* ------------------------------------------------------ formatação */

  function numero(valor, casas) {
    if (valor === '' || valor === null || valor === undefined) return '—';
    var n = Number(valor);
    if (isNaN(n)) return String(valor);
    return n.toLocaleString('pt-BR', {
      minimumFractionDigits: casas === undefined ? 0 : casas,
      maximumFractionDigits: casas === undefined ? 2 : casas
    });
  }

  function dinheiro(valor) {
    if (valor === '' || valor === null || valor === undefined) return '—';
    var n = Number(valor);
    if (isNaN(n)) return String(valor);
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  /** aaaa-mm-dd -> dd/mm/aaaa (sem depender de fuso horário). */
  function data(valor) {
    if (!valor) return '—';
    var texto = String(valor).slice(0, 10);
    var partes = texto.split('-');
    return partes.length === 3 ? partes[2] + '/' + partes[1] + '/' + partes[0] : texto;
  }

  function hoje() {
    var agora = new Date();
    var mes = String(agora.getMonth() + 1).padStart(2, '0');
    var dia = String(agora.getDate()).padStart(2, '0');
    return agora.getFullYear() + '-' + mes + '-' + dia;
  }

  function diasEntre(dataInicial, dataFinal) {
    var a = new Date(String(dataInicial).slice(0, 10) + 'T00:00:00');
    var b = new Date(String(dataFinal).slice(0, 10) + 'T00:00:00');
    if (isNaN(a) || isNaN(b)) return null;
    return Math.round((b - a) / 86400000);
  }

  /* ---------------------------------------------------------- avisos */

  function aviso(mensagem, tipo) {
    var caixa = document.getElementById('avisos');
    var item = el('div', { class: 'aviso' + (tipo ? ' aviso--' + tipo : ''), texto: mensagem });
    caixa.appendChild(item);
    setTimeout(function () {
      item.style.transition = 'opacity .25s';
      item.style.opacity = '0';
      setTimeout(function () { if (item.parentNode) item.parentNode.removeChild(item); }, 260);
    }, tipo === 'erro' ? 5200 : 2800);
  }

  var contadorCarregando = 0;
  function carregando(ligado) {
    contadorCarregando = Math.max(0, contadorCarregando + (ligado ? 1 : -1));
    document.getElementById('carregando').hidden = contadorCarregando === 0;
  }

  /* ---------------------------------------------------------- painel */

  var painelAberto = null;

  function abrirPainel(titulo, conteudo) {
    fecharPainel();
    var sobreposicao = document.getElementById('sobreposicao');
    sobreposicao.hidden = false;
    sobreposicao.onclick = fecharPainel;

    var painel = el('div', { class: 'painel', role: 'dialog' }, [
      el('div', { class: 'painel__topo' }, [
        el('h2', { texto: titulo }),
        el('button', { class: 'painel__fechar', type: 'button', 'aria-label': 'Fechar', onclick: fecharPainel, texto: '×' })
      ]),
      conteudo
    ]);
    document.body.appendChild(painel);
    painelAberto = painel;
    return painel;
  }

  function fecharPainel() {
    if (painelAberto && painelAberto.parentNode) painelAberto.parentNode.removeChild(painelAberto);
    painelAberto = null;
    document.getElementById('sobreposicao').hidden = true;
  }

  /** Confirmação com texto próprio, no lugar do confirm() do navegador. */
  function confirmar(titulo, mensagem, rotuloConfirmar, perigoso) {
    return new Promise(function (resolver) {
      var conteudo = el('div', {}, [
        el('p', { texto: mensagem, style: 'margin-bottom:16px;color:var(--texto-suave)' }),
        el('div', { class: 'formulario__acoes' }, [
          el('button', {
            class: 'botao botao--fantasma', type: 'button',
            onclick: function () { fecharPainel(); resolver(false); }, texto: 'Cancelar'
          }),
          el('button', {
            class: 'botao' + (perigoso ? ' botao--perigo' : ''), type: 'button',
            onclick: function () { fecharPainel(); resolver(true); },
            texto: rotuloConfirmar || 'Confirmar'
          })
        ])
      ]);
      abrirPainel(titulo, conteudo);
    });
  }

  /* ------------------------------------------------------ componentes */

  var CORES_STATUS = {
    'Recebido': 'info', 'Aguardando programação': 'atencao', 'Programado': 'info',
    'Em produção': 'info', 'Pronto': 'ok', 'Separado': 'ok', 'Entregue': 'ok', 'Cancelado': 'neutro',
    'Planejada': 'info', 'Concluída': 'ok', 'Parada': 'atencao',
    'OK': 'ok', 'REPOR': 'erro', 'DEFINIR MÍNIMO': 'atencao',
    'Sim': 'atencao', 'Não': 'neutro'
  };

  function selo(texto, tipoForcado) {
    var tipo = tipoForcado || CORES_STATUS[texto] || 'neutro';
    return el('span', { class: 'selo selo--' + tipo, texto: texto || '—' });
  }

  function indicador(rotulo, valor, nota, alerta) {
    return el('div', { class: 'indicador' + (alerta ? ' indicador--alerta' : '') }, [
      el('div', { class: 'indicador__rotulo', texto: rotulo }),
      el('div', { class: 'indicador__valor', texto: valor }),
      nota ? el('div', { class: 'indicador__nota', texto: nota }) : null
    ]);
  }

  function linhaDetalhe(rotulo, valor) {
    return el('div', {}, [

      typeof valor === 'string' || typeof valor === 'number'

        : el('span', {}, [valor])
    ]);
  }

  /** Cartão de lista, usado em quase todas as telas. */
  function cartao(opcoes) {
    var linhas = (opcoes.linhas || []).filter(Boolean).map(function (par) {
      return el('div', { class: 'cartao__linha' }, [
        el('span', { texto: par[0] }),
        typeof par[1] === 'object' && par[1] !== null ? el('span', {}, [par[1]]) : el('span', { texto: String(par[1]) })
      ]);
    });
    return el('div', {
      class: 'cartao' + (opcoes.aoClicar ? ' cartao--clicavel' : ''),
      onclick: opcoes.aoClicar
    }, [
      el('div', { class: 'cartao__topo' }, [
        el('div', {}, [
          el('div', { class: 'cartao__titulo', texto: opcoes.titulo }),
          opcoes.meta ? el('div', { class: 'cartao__meta', texto: opcoes.meta }) : null
        ]),
        opcoes.selo || null
      ]),
      linhas.length ? el('div', { class: 'cartao__linhas' }, linhas) : null
    ]);
  }

  /** Tabela simples para a visão de desktop. */
  function tabela(colunas, linhas, aoClicarLinha) {
    var cabecalho = el('tr', {}, colunas.map(function (coluna) {
      return el('th', { class: coluna.numerico ? 'numero' : '', texto: coluna.rotulo });
    }));
    var corpo = linhas.map(function (registro) {
      var tr = el('tr', { class: aoClicarLinha ? 'clicavel' : '' }, colunas.map(function (coluna) {
        var valor = coluna.valor(registro);
        return el('td', { class: coluna.numerico ? 'numero' : '' },
          typeof valor === 'object' && valor !== null ? [valor] : [document.createTextNode(valor === undefined || valor === null || valor === '' ? '—' : String(valor))]);
      }));
      if (aoClicarLinha) tr.addEventListener('click', function () { aoClicarLinha(registro); });
      return tr;
    });
    return el('div', { class: 'tabela-envolve' }, [
      el('table', { class: 'tabela' }, [
        el('thead', {}, [cabecalho]),
        el('tbody', {}, corpo)
      ])
    ]);
  }

/* ===== js/api.js ===== */
/* GPEL - comunicação com o Apps Script.
   Toda ida ao servidor passa por aqui. */

window.GPEL = window.GPEL || {};

GPEL.api = (function () {
  var cfg = GPEL.config;
  var prefs = GPEL.preferencias;

  function url() {
    return prefs.ler(cfg.CHAVE_URL, cfg.URL_API_PADRAO) || '';
  }

  function token() {
    return prefs.ler(cfg.CHAVE_TOKEN, cfg.TOKEN_PADRAO) || '';
  }

  function usuario() {
    return prefs.ler(cfg.CHAVE_USUARIO, '') || '';
  }

  /* O aplicativo funciona de dois jeitos:
     1. servido pelo próprio Apps Script (com login do Google) -> google.script.run;
     2. hospedado fora (GitHub Pages, Cloudflare) -> fetch para a URL do Web App.
     O resto do código não precisa saber qual dos dois está valendo. */
  function dentroDoAppsScript() {
    return typeof google !== 'undefined' && !!google.script && !!google.script.run;
  }

  function configurada() {
    return dentroDoAppsScript() || !!url();
  }

  function definirUrl(novaUrl) { prefs.gravar(cfg.CHAVE_URL, (novaUrl || '').trim()); }
  function definirToken(novoToken) { prefs.gravar(cfg.CHAVE_TOKEN, (novoToken || '').trim()); }
  function definirUsuario(nome) { prefs.gravar(cfg.CHAVE_USUARIO, (nome || '').trim()); }

  function exigirConfiguracao() {
    if (!configurada()) {
      throw new Error('O endereço do servidor ainda não foi informado. Abra Configurações e cole a URL do aplicativo.');
    }
  }

  function interpretar(texto) {
    var dados;
    try {
      dados = JSON.parse(texto);
    } catch (e) {
      throw new Error('O servidor respondeu em um formato inesperado. Confira se a URL termina em /exec e se o acesso está liberado.');
    }
    if (!dados.ok) throw new Error(dados.erro || 'Não foi possível concluir a operação.');
    return dados.dados;
  }

  function tratarResposta(resposta) {
    return resposta.text().then(interpretar);
  }

  /* Quando o Web App passa a exigir login, o Google responde com um desvio para
     a tela de login — sem cabeçalho de CORS. O navegador mostra só "Failed to
     fetch", que não diz nada para quem está usando. Aqui isso vira um erro com
     explicação e com o caminho da solução. */
  function erroDeConexao() {
    var erro = new Error(
      'Este endereço não consegue mais falar com a planilha. O aplicativo agora pede login ' +
      'do Google, e o login só funciona abrindo o endereço do próprio Google.');
    erro.precisaAbrirNoGoogle = true;
    return erro;
  }

  function comTratamentoDeRede(promessa) {
    return promessa.catch(function (erro) {
      // TypeError é a falha de rede/CORS do fetch; os demais erros são do servidor.
      if (erro instanceof TypeError) throw erroDeConexao();
      throw erro;
    });
  }

  /** Chamada pela ponte do Apps Script (quando a página é servida por ele). */
  function pelaPonte(funcao, argumento) {
    return new Promise(function (resolver, rejeitar) {
      google.script.run
        .withSuccessHandler(function (texto) {
          try { resolver(interpretar(texto)); } catch (erro) { rejeitar(erro); }
        })
        .withFailureHandler(function (erro) {
          rejeitar(new Error(erro && erro.message ? erro.message : 'Falha ao falar com o servidor.'));
        })[funcao](argumento);
    });
  }

  /** Leitura. */
  function buscar(parametros) {
    if (dentroDoAppsScript()) {
      return pelaPonte('apiGet', Object.assign({}, parametros, { token: token() }));
    }
    exigirConfiguracao();
    var query = Object.keys(parametros)
      .filter(function (chave) { return parametros[chave] !== undefined && parametros[chave] !== null && parametros[chave] !== ''; })
      .map(function (chave) { return encodeURIComponent(chave) + '=' + encodeURIComponent(parametros[chave]); });
    if (token()) query.push('token=' + encodeURIComponent(token()));
    return comTratamentoDeRede(
      fetch(url() + '?' + query.join('&'), { method: 'GET', redirect: 'follow' })
    ).then(tratarResposta);
  }

  /** Gravação (POST).
     O Content-Type é "text/plain" de propósito: evita a requisição de
     verificação (preflight) do navegador, que o Apps Script não responde.
     O corpo continua sendo JSON e é lido normalmente no doPost. */
  function enviar(corpo) {
    corpo = Object.assign({}, corpo, { token: token(), usuario: corpo.usuario || usuario() });
    if (dentroDoAppsScript()) return pelaPonte('apiPost', corpo);
    exigirConfiguracao();
    return comTratamentoDeRede(fetch(url(), {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(corpo)
    })).then(tratarResposta);
  }

  return {
    url: url, token: token, usuario: usuario, configurada: configurada, dentroDoAppsScript: dentroDoAppsScript,
    definirUrl: definirUrl, definirToken: definirToken, definirUsuario: definirUsuario,
    buscar: buscar, enviar: enviar,

    /* atalhos usados pelas telas */
    ping: function () { return buscar({ action: 'ping' }); },
    carregarTudo: function () { return buscar({ action: 'tudo' }); },
    listar: function (tabela, filtro) {
      return buscar({ action: 'list', table: tabela, filtro: filtro ? JSON.stringify(filtro) : '' })
        .then(function (d) { return d.registros; });
    },
    historico: function (codigo) {
      return buscar({ action: 'historico', codigo: codigo }).then(function (d) { return d.registros; });
    },
    estoque: function () { return buscar({ action: 'estoque' }).then(function (d) { return d.registros; }); },
    criar: function (tabela, valores) { return enviar({ action: 'criar', table: tabela, valores: valores }); },
    atualizar: function (tabela, id, valores) { return enviar({ action: 'atualizar', table: tabela, id: id, valores: valores }); },
    excluir: function (tabela, id) { return enviar({ action: 'excluir', table: tabela, id: id }); },
    definirEstoqueMinimo: function (codigo, minimo) { return enviar({ action: 'estoqueMinimo', codigo: codigo, minimo: minimo }); },
    aprovarAjuste: function (id) { return enviar({ action: 'aprovarAjuste', id: id }); }
  };
})();

/* ===== js/estado.js ===== */
/* GPEL - estado do aplicativo.
   Guarda em memória o que veio do servidor, para as telas não precisarem
   buscar tudo de novo a cada troca de aba. */

window.GPEL = window.GPEL || {};

GPEL.estado = (function () {
  var dados = {};
  var meta = null;
  var carregadoEm = null;
  var CHAVE_CACHE = 'gpel.cache';

  function aplicar(resposta, quando) {
    meta = resposta.meta;
    dados = resposta;
    carregadoEm = quando || new Date();
    return dados;
  }

  /* A última carga fica guardada no próprio aparelho. Assim o aplicativo abre
     mostrando os dados de antes (instantâneo) enquanto busca os novos por trás.
     O cache é descartado se o endereço do servidor mudar. */
  function lerCache() {
    try {
      var bruto = window.localStorage.getItem(CHAVE_CACHE);
      if (!bruto) return null;
      var guardado = JSON.parse(bruto);
      if (!guardado || guardado.url !== GPEL.api.url() || !guardado.dados || !guardado.dados.meta) return null;
      return guardado;
    } catch (e) {
      return null;
    }
  }

  function gravarCache(resposta) {
    try {
      window.localStorage.setItem(CHAVE_CACHE, JSON.stringify({
        url: GPEL.api.url(),
        quando: new Date().toISOString(),
        dados: resposta
      }));
    } catch (e) {
      /* sem espaço ou sem armazenamento: o aplicativo funciona igual, só sem o atalho */
    }
  }

  /** silencioso = busca por trás, sem a tela de "carregando". */
  function carregar(forcar, silencioso) {
    if (!forcar && meta) return Promise.resolve(dados);
    if (!silencioso) GPEL.ui.carregando(true);
    return GPEL.api.carregarTudo()
      .then(function (resposta) {
        gravarCache(resposta);
        return aplicar(resposta);
      })
      .finally(function () { if (!silencioso) GPEL.ui.carregando(false); });
  }

  /**
   * Abertura do aplicativo: devolve se havia dados guardados (já aplicados)
   * e a promessa da busca ao servidor.
   */
  function iniciar() {
    var guardado = lerCache();
    if (guardado) aplicar(guardado.dados, new Date(guardado.quando));
    return { temCache: !!guardado, promessa: carregar(true, !!guardado) };
  }

  /** Recarrega tudo e redesenha a tela atual. */
  function atualizar() {
    return carregar(true).then(function (d) {
      if (GPEL.rotas) GPEL.rotas.redesenhar();
      return d;
    });
  }

  function tabela(nome) {
    return dados[nome] || [];
  }

  function definicao(nomeTabela) {
    return meta && meta.tabelas ? meta.tabelas[nomeTabela] : null;
  }

  function enumDe(nome) {
    return (meta && meta.enums && meta.enums[nome]) || [];
  }

  /** Nome legível de um registro de cadastro a partir do código. */
  function rotuloDe(nomeTabela, codigo) {
    if (!codigo) return '—';
    var def = definicao(nomeTabela);
    if (!def) return String(codigo);
    var achado = tabela(nomeTabela).filter(function (r) { return String(r[def.chave]).trim() === String(codigo).trim(); })[0];
    return achado ? String(achado[def.rotulo] || achado[def.chave]) : String(codigo);
  }

  /** Opções de um cadastro para usar em campos de seleção. */
  function opcoesDe(nomeTabela, filtro) {
    var def = definicao(nomeTabela);
    if (!def) return [];
    var registros = tabela(nomeTabela);
    if (filtro && filtro.coluna) {
      registros = registros.filter(function (r) { return String(r[filtro.coluna]).trim() === filtro.valor; });
    }
    return registros.map(function (r) {
      return { valor: String(r[def.chave]), rotulo: String(r[def.rotulo] || r[def.chave]), registro: r };
    }).sort(function (a, b) { return a.rotulo.localeCompare(b.rotulo, 'pt-BR'); });
  }

  /** Cadastro correspondente à classe (Produto/Insumo). */
  function cadastroDaClasse(classe) {
    return classe === 'Insumo' ? 'CAD_INSUMOS' : 'CAD_PRODUTOS';
  }

  function itemDaClasse(classe, codigo) {
    var nomeTabela = cadastroDaClasse(classe);
    var def = definicao(nomeTabela);
    if (!def) return null;
    return tabela(nomeTabela).filter(function (r) { return String(r[def.chave]).trim() === String(codigo).trim(); })[0] || null;
  }

  function saldoDe(codigo) {
    var linha = tabela('ESTOQUE_ATUAL').filter(function (r) { return String(r['Código']).trim() === String(codigo).trim(); })[0];
    return linha ? Number(linha['Saldo Atual']) || 0 : 0;
  }

  return {
    carregar: carregar,
    iniciar: iniciar,
    atualizar: atualizar,
    tabela: tabela,
    definicao: definicao,
    enumDe: enumDe,
    rotuloDe: rotuloDe,
    opcoesDe: opcoesDe,
    cadastroDaClasse: cadastroDaClasse,
    itemDaClasse: itemDaClasse,
    saldoDe: saldoDe,
    get meta() { return meta; },
    get carregadoEm() { return carregadoEm; },
    get dados() { return dados; }
  };
})();

/* ===== js/formulario.js ===== */
/* GPEL - construtor de formulários.
   As telas dizem QUAIS campos aparecem; a estrutura de cada campo vem da
   definição da tabela (Apps Script), então não há nomes de coluna repetidos.

   Atenção: os valores mostrados como "calculados" aqui são apenas uma prévia
   na tela. Quem calcula de verdade, e grava, é o Apps Script (Regras.gs).
   Nunca duplique uma regra de cálculo fora de lá. */

window.GPEL = window.GPEL || {};

GPEL.formulario = (function () {
  var ui = GPEL.ui;
  var el = ui.el;

  /** Prévias exibidas enquanto a usuária digita (não são gravadas). */
  var PREVIAS = {
    'Valor Total': function (v) {
      var total = (Number(v['Quantidade']) || 0) * (Number(v['Valor Unit.']) || 0);
      return ui.dinheiro(total);
    },
    'Prod./h': function (v) {
      var horas = Number(v['Horas']) || 0;
      return horas > 0 ? ui.numero((Number(v['Produzido']) || 0) / horas, 2) : '—';
    },
    'Prod./HH': function (v) {
      var horas = Number(v['Horas']) || 0;
      var pessoas = Number(v['Pessoas']) || 0;
      return (horas > 0 && pessoas > 0) ? ui.numero((Number(v['Produzido']) || 0) / (horas * pessoas), 2) : '—';
    },
    'Saldo Sistema': function (v) {
      return v['Código'] ? ui.numero(GPEL.estado.saldoDe(v['Código']), 2) : '—';
    },
    'Diferença': function (v) {
      if (v['Contagem Física'] === '' || v['Contagem Física'] === undefined) return '—';
      var saldo = v['Código'] ? GPEL.estado.saldoDe(v['Código']) : 0;
      return ui.numero((Number(v['Contagem Física']) || 0) - saldo, 2);
    }
  };

  /** Campos preenchidos automaticamente a partir dos cadastros. */
  var AUTOMATICOS = {
    'Unidade': function (v, contexto) {
      if (contexto.tabela === 'PEDIDOS' || contexto.tabela === 'PRODUCAO') {
        var produto = GPEL.estado.itemDaClasse('Produto', v['Produto']);
        return produto ? produto['Unidade'] : '';
      }
      var item = GPEL.estado.itemDaClasse(v['Classe'], v['Código Item']);
      return item ? item['Unidade'] : '';
    },
    'Item': function (v) {
      var codigo = v['Código Item'] !== undefined ? v['Código Item'] : v['Código'];
      var item = GPEL.estado.itemDaClasse(v['Classe'], codigo);
      if (!item) return '';
      return v['Classe'] === 'Insumo' ? item['Item'] : item['Produto'];
    }
  };

  /** Junta a definição vinda do servidor com os ajustes da tela. */
  function resolverCampo(nomeTabela, pedido) {
    var def = GPEL.estado.definicao(nomeTabela);
    var base = {};
    if (def) {
      (def.campos || []).forEach(function (campo) {
        if (campo.nome === pedido.nome) base = campo;
      });
    }
    var campo = Object.assign({}, base, pedido);
    campo.rotulo = campo.rotulo || campo.nome;
    return campo;
  }

  function opcoesDoCampo(campo, valores) {
    if (campo.opcoes) return typeof campo.opcoes === 'function' ? campo.opcoes(valores) : campo.opcoes;
    if (campo.tipo === 'lista') {
      return GPEL.estado.enumDe(campo.lista).map(function (o) { return { valor: o, rotulo: o }; });
    }
    if (campo.tipo === 'ref') {
      if (campo.dependeDe === 'Classe') {
        if (!valores['Classe']) return [];
        return GPEL.estado.opcoesDe(GPEL.estado.cadastroDaClasse(valores['Classe']));
      }
      if (campo.ref) return GPEL.estado.opcoesDe(campo.ref.tabela, campo.ref.filtro);
    }
    return [];
  }

  /**
   * Abre um formulário em painel.
   * opcoes: { titulo, tabela, campos:[{nome,...}], valores, aoSalvar(valores), rotuloSalvar, extra }
   */
  function abrir(opcoes) {
    var valores = Object.assign({}, opcoes.valores || {});
    var campos = (opcoes.campos || []).map(function (c) {
      return resolverCampo(opcoes.tabela, typeof c === 'string' ? { nome: c } : c);
    });

    // valores padrão
    campos.forEach(function (campo) {
      if (valores[campo.nome] === undefined || valores[campo.nome] === '') {
        if (campo.padrao !== undefined) valores[campo.nome] = campo.padrao === 'hoje' ? ui.hoje() : campo.padrao;
      }
    });

    var corpo = el('div', {});
    var painel = ui.abrirPainel(opcoes.titulo, corpo);

    /* Os campos são montados UMA vez. Depois, só as partes derivadas
       (prévias, campos automáticos e listas dependentes) são atualizadas.
       Redesenhar o formulário inteiro a cada digitação faria a usuária
       perder o foco e o valor recém-digitado. */
    var controles = {};
    var formulario = el('form', { class: 'formulario', onsubmit: submeter });

    campos.forEach(function (campo) { formulario.appendChild(montarCampo(campo)); });
    if (opcoes.extra) formulario.appendChild(opcoes.extra);
    formulario.appendChild(el('div', { class: 'formulario__acoes' }, [
      el('button', { class: 'botao botao--fantasma', type: 'button', texto: 'Cancelar', onclick: ui.fecharPainel }),
      el('button', { class: 'botao', type: 'submit', texto: opcoes.rotuloSalvar || 'Salvar' })
    ]));
    corpo.appendChild(formulario);
    atualizarDerivados();
    return painel;

    function montarCampo(campo) {
      var caixa = el('div', { class: 'campo' });
      caixa.appendChild(el('label', { for: 'campo-' + campo.nome, texto: campo.rotulo + (campo.obrigatorio ? ' *' : '') }));

      if (campo.tipo === 'calculado' || campo.somenteLeitura || campo.auto) {
        caixa.className = 'campo campo--calculado';
        var mostrador = el('div', { class: 'campo__valor', texto: '—' });
        caixa.appendChild(mostrador);
        if (campo.tipo === 'calculado') {
          caixa.appendChild(el('div', { class: 'campo__ajuda', texto: 'Calculado pelo sistema.' }));
        }
        controles[campo.nome] = { campo: campo, mostrador: mostrador };
        return caixa;
      }

      var entrada;
      if (campo.tipo === 'lista' || campo.tipo === 'ref') {
        entrada = el('select', { id: 'campo-' + campo.nome });
        preencherOpcoes(entrada, campo);
      } else if (campo.tipo === 'textoLongo') {
        entrada = el('textarea', { id: 'campo-' + campo.nome });
        entrada.value = valores[campo.nome] || '';
      } else {
        var tipoHtml = 'text';
        var passo = null;
        if (campo.tipo === 'data') tipoHtml = 'date';
        else if (campo.tipo === 'numero') { tipoHtml = 'number'; passo = '1'; }
        else if (campo.tipo === 'decimal' || campo.tipo === 'dinheiro') { tipoHtml = 'number'; passo = '0.01'; }
        entrada = el('input', {
          id: 'campo-' + campo.nome,
          type: tipoHtml,
          step: passo,
          inputmode: tipoHtml === 'number' ? 'decimal' : null,
          placeholder: campo.exemplo || ''
        });
        entrada.value = valores[campo.nome] === undefined || valores[campo.nome] === null ? '' : valores[campo.nome];
      }

      function registrar() {
        valores[campo.nome] = entrada.value;
        atualizarDerivados(campo.nome);
      }
      entrada.addEventListener('input', registrar);
      entrada.addEventListener('change', registrar);

      caixa.appendChild(entrada);
      if (campo.ajuda) caixa.appendChild(el('div', { class: 'campo__ajuda', texto: campo.ajuda }));
      caixa.appendChild(el('div', { class: 'campo__erro', hidden: true }));
      controles[campo.nome] = { campo: campo, entrada: entrada, caixa: caixa };
      return caixa;
    }

    function preencherOpcoes(selecao, campo) {
      var lista = opcoesDoCampo(campo, valores);
      var escolhido = String(valores[campo.nome] || '');
      ui.limpar(selecao);
      selecao.appendChild(el('option', { value: '', texto: lista.length ? 'Selecione…' : 'Nenhuma opção disponível' }));
      var aindaExiste = false;
      lista.forEach(function (opcao) {
        var item = el('option', { value: opcao.valor, texto: opcao.rotulo });
        if (escolhido === String(opcao.valor)) { item.selected = true; aindaExiste = true; }
        selecao.appendChild(item);
      });
      if (!aindaExiste && escolhido) {
        valores[campo.nome] = '';
        selecao.value = '';
      }
    }

    /** Atualiza prévias, campos automáticos e listas que dependem de outro campo. */
    function atualizarDerivados(campoAlterado) {
      var contexto = { tabela: opcoes.tabela };

      campos.forEach(function (campo) {
        var controle = controles[campo.nome];
        if (!controle) return;

        if (controle.mostrador) {
          var texto;
          if (campo.auto && AUTOMATICOS[campo.nome]) texto = AUTOMATICOS[campo.nome](valores, contexto);
          else if (PREVIAS[campo.nome]) texto = PREVIAS[campo.nome](valores);
          else texto = valores[campo.nome];
          controle.mostrador.textContent = (texto === '' || texto === undefined || texto === null) ? '—' : texto;
          return;
        }

        if (campoAlterado && campo.dependeDe === campoAlterado && controle.entrada) {
          preencherOpcoes(controle.entrada, campo);
        }
      });
    }

    function submeter(evento) {
      evento.preventDefault();
      var faltando = campos.filter(function (campo) {
        if (!campo.obrigatorio || campo.auto || campo.tipo === 'calculado') return false;
        var valor = valores[campo.nome];
        return valor === undefined || valor === null || String(valor).trim() === '';
      });

      campos.forEach(function (campo) {
        var controle = controles[campo.nome];
        if (!controle || !controle.caixa) return;
        var erro = controle.caixa.querySelector('.campo__erro');
        var falta = faltando.indexOf(campo) !== -1;
        controle.caixa.classList.toggle('campo--erro', falta);
        if (erro) {
          erro.textContent = falta ? 'Campo obrigatório.' : '';
          erro.hidden = !falta;
        }
      });

      if (faltando.length) {
        ui.aviso('Preencha: ' + faltando.map(function (c) { return c.rotulo; }).join(', '), 'erro');
        return;
      }

      var paraEnviar = {};
      campos.forEach(function (campo) {
        if (campo.tipo === 'calculado') return; // o servidor calcula
        if (campo.auto) return;                 // o servidor busca no cadastro
        paraEnviar[campo.nome] = valores[campo.nome] === undefined ? '' : valores[campo.nome];
      });

      ui.carregando(true);
      Promise.resolve(opcoes.aoSalvar(paraEnviar))
        .then(function () { ui.fecharPainel(); })
        .catch(function (erro) { ui.aviso(erro.message, 'erro'); })
        .finally(function () { ui.carregando(false); });
    }
  }

  return { abrir: abrir };
})();

/* ===== js/recurso.js ===== */
/* GPEL - lista genérica de registros.
   Usada por Pedidos, Produção, Compras, Inventário e pelos cadastros.
   No celular mostra cartões; no computador, tabela. */

window.GPEL = window.GPEL || {};

GPEL.recurso = (function () {
  var ui = GPEL.ui;
  var el = ui.el;

  function ehDesktop() { return window.innerWidth >= 900; }

  /**
   * config: {
   *   tabela, registros(), busca(r), filtros:[{rotulo, teste(r)}], ordenar(a,b),
   *   cartao(r), colunas:[{rotulo, valor(r), numerico}], aoAbrir(r), vazio
   * }
   */
  function lista(config) {
    var estadoFiltro = { filtro: 0, termo: '' };
    var caixa = el('div', {});
    desenhar();
    return caixa;

    function desenhar() {
      ui.limpar(caixa);

      if (config.busca) {
        var campoBusca = el('input', { type: 'search', placeholder: config.placeholderBusca || 'Buscar…' });
        campoBusca.value = estadoFiltro.termo;
        campoBusca.addEventListener('input', function () {
          estadoFiltro.termo = campoBusca.value;
          desenharResultado();
        });
        caixa.appendChild(el('div', { class: 'busca' }, [campoBusca]));
      }

      if (config.filtros && config.filtros.length) {
        var barra = el('div', { class: 'filtros' });
        config.filtros.forEach(function (filtro, indice) {
          barra.appendChild(el('button', {
            type: 'button',
            class: 'filtro' + (estadoFiltro.filtro === indice ? ' ativo' : ''),
            texto: filtro.rotulo,
            onclick: function () { estadoFiltro.filtro = indice; desenhar(); }
          }));
        });
        caixa.appendChild(barra);
      }

      caixa.appendChild(el('div', { id: 'resultado-lista' }));
      desenharResultado();
    }

    function desenharResultado() {
      var alvo = caixa.querySelector('#resultado-lista');
      ui.limpar(alvo);

      var registros = config.registros().slice();
      var filtroAtual = config.filtros && config.filtros[estadoFiltro.filtro];
      if (filtroAtual && filtroAtual.teste) registros = registros.filter(filtroAtual.teste);

      var termo = estadoFiltro.termo.trim().toLowerCase();
      if (termo && config.busca) {
        registros = registros.filter(function (r) {
          return String(config.busca(r) || '').toLowerCase().indexOf(termo) !== -1;
        });
      }

      if (config.ordenar) registros.sort(config.ordenar);

      alvo.appendChild(el('div', { class: 'secao__titulo', texto: registros.length + (registros.length === 1 ? ' registro' : ' registros') }));

      if (!registros.length) {
        alvo.appendChild(ui.vazio(config.vazio || 'Nada por aqui ainda.'));
        return;
      }

      if (ehDesktop() && config.colunas) {
        alvo.appendChild(ui.tabela(config.colunas, registros, config.aoAbrir));
      } else {
        registros.forEach(function (r) { alvo.appendChild(config.cartao(r)); });
      }
    }
  }

  /** Botão de ação principal do cabeçalho. */
  function botaoNovo(rotulo, aoClicar) {
    return el('button', { class: 'botao botao--pequeno', type: 'button', texto: rotulo, onclick: aoClicar });
  }

  /** Cria um registro e recarrega os dados. */
  function salvarNovo(tabela, valores, mensagem) {
    return GPEL.api.criar(tabela, valores).then(function (resposta) {
      ui.aviso(mensagem || 'Registro salvo.', 'ok');
      return GPEL.estado.atualizar().then(function () { return resposta; });
    });
  }

  /** Atualiza um registro e recarrega os dados. */
  function salvarEdicao(tabela, id, valores, mensagem) {
    return GPEL.api.atualizar(tabela, id, valores).then(function (resposta) {
      ui.aviso(mensagem || 'Alterações salvas.', 'ok');
      return GPEL.estado.atualizar().then(function () { return resposta; });
    });
  }

  /** Painel de detalhe padrão: lista de rótulo/valor + ações. */
  function detalhe(titulo, linhas, acoes) {
    var conteudo = el('div', {}, [
      el('div', { class: 'lista-detalhe' }, linhas.filter(Boolean).map(function (par) {
        return ui.linhaDetalhe(par[0], par[1]);
      })),
      acoes && acoes.length ? el('div', { class: 'formulario__acoes' }, acoes) : null
    ]);
    return ui.abrirPainel(titulo, conteudo);
  }

  return {
    lista: lista,
    botaoNovo: botaoNovo,
    salvarNovo: salvarNovo,
    salvarEdicao: salvarEdicao,
    detalhe: detalhe,
    ehDesktop: ehDesktop
  };
})();

/* ===== js/telas/pedidos.js ===== */
/* GPEL - Pedidos. */

window.GPEL = window.GPEL || {};
GPEL.telas = GPEL.telas || {};

GPEL.telas.pedidos = (function () {
  var ui = GPEL.ui;
  var el = ui.el;
  var TABELA = 'PEDIDOS';

  var CAMPOS = [
    { nome: 'Data' },
    { nome: 'Cliente' },
    { nome: 'Produto' },
    { nome: 'Quantidade', exemplo: '0' },
    { nome: 'Valor Unit.', rotulo: 'Valor unitário (R$)', exemplo: '0,00' },
    { nome: 'Valor Total' },
    { nome: 'Unidade' },
    { nome: 'Prazo / Data Entrega', rotulo: 'Entrega' },
    { nome: 'Status', rotulo: 'Situação' },
    { nome: 'Origem comercial', ajuda: 'Como o pedido chegou até a GPEL.' }
  ];

  var ENCERRADOS = ['Entregue', 'Cancelado'];

  function emAberto(pedido) { return ENCERRADOS.indexOf(String(pedido['Status'])) === -1; }

  function atrasado(pedido) {
    if (!emAberto(pedido) || !pedido['Prazo / Data Entrega']) return false;
    return String(pedido['Prazo / Data Entrega']).slice(0, 10) < ui.hoje();
  }

  function registros() {
    return GPEL.estado.tabela(TABELA);
  }

  function novo(valoresIniciais) {
    GPEL.formulario.abrir({
      titulo: 'Novo pedido',
      tabela: TABELA,
      campos: CAMPOS,
      valores: Object.assign({ Data: ui.hoje(), Status: 'Recebido' }, valoresIniciais || {}),
      rotuloSalvar: 'Salvar pedido',
      aoSalvar: function (valores) {
        return GPEL.recurso.salvarNovo(TABELA, valores, 'Pedido registrado.');
      }
    });
  }

  function editar(pedido) {
    ui.fecharPainel();
    GPEL.formulario.abrir({
      titulo: 'Editar pedido',
      tabela: TABELA,
      campos: CAMPOS,
      valores: pedido,
      aoSalvar: function (valores) {
        return GPEL.recurso.salvarEdicao(TABELA, pedido['ID Pedido'], valores, 'Pedido atualizado.');
      }
    });
  }

  /** Troca rápida de situação, sem abrir o formulário inteiro. */
  function mudarStatus(pedido) {
    ui.fecharPainel();
    var selecao = el('select', {});
    GPEL.estado.enumDe('STATUS_PEDIDO').forEach(function (status) {
      var opcao = el('option', { value: status, texto: status });
      if (status === pedido['Status']) opcao.selected = true;
      selecao.appendChild(opcao);
    });

    var conteudo = el('div', {}, [
      el('div', { class: 'campo' }, [el('label', { texto: 'Situação do pedido' }), selecao]),
      el('div', { class: 'formulario__acoes', style: 'margin-top:16px' }, [
        el('button', { class: 'botao botao--fantasma', type: 'button', texto: 'Cancelar', onclick: ui.fecharPainel }),
        el('button', {
          class: 'botao', type: 'button', texto: 'Salvar',
          onclick: function () {
            ui.carregando(true);
            GPEL.recurso.salvarEdicao(TABELA, pedido['ID Pedido'], Object.assign({}, pedido, { 'Status': selecao.value }), 'Situação atualizada.')
              .then(function () { ui.fecharPainel(); })
              .catch(function (erro) { ui.aviso(erro.message, 'erro'); })
              .finally(function () { ui.carregando(false); });
          }
        })
      ])
    ]);
    ui.abrirPainel('Situação do pedido', conteudo);
  }

  function abrirDetalhe(pedido) {
    GPEL.recurso.detalhe('Pedido', [
      ['Cliente', GPEL.estado.rotuloDe('CAD_CLIENTES', pedido['Cliente'])],
      ['Produto', GPEL.estado.rotuloDe('CAD_PRODUTOS', pedido['Produto'])],
      ['Quantidade', ui.numero(pedido['Quantidade'], 2) + ' ' + (pedido['Unidade'] || '')],
      ['Valor unitário', ui.dinheiro(pedido['Valor Unit.'])],
      ['Valor total', ui.dinheiro(pedido['Valor Total'])],
      ['Data do pedido', ui.data(pedido['Data'])],
      ['Entrega', ui.data(pedido['Prazo / Data Entrega']) + (atrasado(pedido) ? ' (em atraso)' : '')],
      ['Origem', pedido['Origem comercial'] || '—'],
      ['Situação', ui.selo(pedido['Status'])]
    ], [
      el('button', { class: 'botao botao--fantasma', type: 'button', texto: 'Editar', onclick: function () { editar(pedido); } }),
      el('button', { class: 'botao', type: 'button', texto: 'Mudar situação', onclick: function () { mudarStatus(pedido); } })
    ]);
  }

  function cartao(pedido) {
    return ui.cartao({
      titulo: GPEL.estado.rotuloDe('CAD_CLIENTES', pedido['Cliente']),
      meta: GPEL.estado.rotuloDe('CAD_PRODUTOS', pedido['Produto']),
      selo: ui.selo(pedido['Status']),
      linhas: [
        ['Quantidade', ui.numero(pedido['Quantidade'], 2) + ' ' + (pedido['Unidade'] || '')],
        ['Valor total', ui.dinheiro(pedido['Valor Total'])],
        ['Entrega', atrasado(pedido)
          ? ui.selo(ui.data(pedido['Prazo / Data Entrega']) + ' · atrasado', 'erro')
          : ui.data(pedido['Prazo / Data Entrega'])]
      ],
      aoClicar: function () { abrirDetalhe(pedido); }
    });
  }

  return {
    titulo: 'Pedidos',
    subtitulo: 'Do recebimento até a entrega',
    novo: novo,
    acoes: function () { return [GPEL.recurso.botaoNovo('+ Pedido', function () { novo(); })]; },
    render: function () {
      return GPEL.recurso.lista({
        registros: registros,
        vazio: 'Nenhum pedido encontrado.',
        placeholderBusca: 'Buscar por cliente ou produto…',
        busca: function (p) {
          return GPEL.estado.rotuloDe('CAD_CLIENTES', p['Cliente']) + ' ' + GPEL.estado.rotuloDe('CAD_PRODUTOS', p['Produto']);
        },
        filtros: [
          { rotulo: 'Em aberto', teste: emAberto },
          { rotulo: 'Atrasados', teste: atrasado },
          { rotulo: 'Entregues', teste: function (p) { return p['Status'] === 'Entregue'; } },
          { rotulo: 'Todos', teste: null }
        ],
        ordenar: function (a, b) { return String(b['Data']).localeCompare(String(a['Data'])); },
        cartao: cartao,
        aoAbrir: abrirDetalhe,
        colunas: [
          { rotulo: 'Data', valor: function (p) { return ui.data(p['Data']); } },
          { rotulo: 'Cliente', valor: function (p) { return GPEL.estado.rotuloDe('CAD_CLIENTES', p['Cliente']); } },
          { rotulo: 'Produto', valor: function (p) { return GPEL.estado.rotuloDe('CAD_PRODUTOS', p['Produto']); } },
          { rotulo: 'Qtde', numerico: true, valor: function (p) { return ui.numero(p['Quantidade'], 2); } },
          { rotulo: 'Total', numerico: true, valor: function (p) { return ui.dinheiro(p['Valor Total']); } },
          { rotulo: 'Entrega', valor: function (p) { return atrasado(p) ? ui.selo(ui.data(p['Prazo / Data Entrega']) + ' · atrasado', 'erro') : ui.data(p['Prazo / Data Entrega']); } },
          { rotulo: 'Situação', valor: function (p) { return ui.selo(p['Status']); } }
        ]
      });
    },
    emAberto: emAberto,
    atrasado: atrasado
  };
})();

  var TABELA = 'PRODUCAO';

  var CAMPOS = [
    { nome: 'Data' },
    { nome: 'Produto', ajuda: 'Apenas produtos de fabricação própria.' },
    { nome: 'Meta', ajuda: 'Quanto era esperado produzir.' },

    { nome: 'Prod./HH' },
    { nome: 'Unidade' },
    { nome: 'MP consumida (kg)', rotulo: 'Matéria-prima consumida (kg)', ajuda: 'Opcional, enquanto a medição não for confiável.' },

      ['Pessoas', ui.numero(producao['Pessoas'], 0)],

      ['Produção por hora/pessoa', ui.numero(producao['Prod./HH'], 2)],
      ['Matéria-prima consumida', producao['MP consumida (kg)'] === '' ? '—' : ui.numero(producao['MP consumida (kg)'], 2) + ' kg'],
      ['Pedido relacionado', producao['Pedido Ref.'] || '—'],
      ['Situação', ui.selo(producao['Status'])]

/* ===== js/telas/estoque.js ===== */
/* GPEL - Estoque (consulta de saldo).
   O saldo mostrado aqui é sempre a soma das movimentações: nunca é digitado. */

window.GPEL = window.GPEL || {};
GPEL.telas = GPEL.telas || {};

GPEL.telas.estoque = (function () {
  var ui = GPEL.ui;
  var el = ui.el;

  function registros() { return GPEL.estado.tabela('ESTOQUE_ATUAL'); }

  function precisaRepor(linha) { return String(linha['Status']) === 'REPOR'; }

  function definirMinimo(linha) {
    ui.fecharPainel();
    var entrada = el('input', { type: 'number', step: '0.01', inputmode: 'decimal' });
    entrada.value = linha['Estoque Mín.'] === '' ? '' : linha['Estoque Mín.'];

    var conteudo = el('div', {}, [
      el('div', { class: 'campo' }, [
        el('label', { texto: 'Estoque mínimo de ' + linha['Item'] }),
        entrada,
        el('div', { class: 'campo__ajuda', texto: 'Quando o saldo ficar igual ou abaixo desse número, o item aparece como REPOR.' })
      ]),
      el('div', { class: 'formulario__acoes', style: 'margin-top:16px' }, [
        el('button', { class: 'botao botao--fantasma', type: 'button', texto: 'Cancelar', onclick: ui.fecharPainel }),
        el('button', {
          class: 'botao', type: 'button', texto: 'Salvar',
          onclick: function () {
            ui.carregando(true);
            GPEL.api.definirEstoqueMinimo(linha['Código'], entrada.value)
              .then(function () {
                ui.aviso('Estoque mínimo atualizado.', 'ok');
                return GPEL.estado.atualizar();
              })
              .then(function () { ui.fecharPainel(); })
              .catch(function (erro) { ui.aviso(erro.message, 'erro'); })
              .finally(function () { ui.carregando(false); });
          }
        })
      ])
    ]);
    ui.abrirPainel('Estoque mínimo', conteudo);
  }

  function abrirDetalhe(linha) {
    GPEL.recurso.detalhe(linha['Item'] || linha['Código'], [
      ['Classe', linha['Classe']],
      ['Unidade', linha['Unidade'] || '—'],
      ['Entradas', ui.numero(linha['Entradas'], 2)],
      ['Saídas', ui.numero(linha['Saídas'], 2)],
      ['Saldo atual', ui.numero(linha['Saldo Atual'], 2)],
      ['Estoque mínimo', linha['Estoque Mín.'] === '' ? 'não definido' : ui.numero(linha['Estoque Mín.'], 2)],
      ['Situação', ui.selo(linha['Status'])]
    ], [
      el('button', {
        class: 'botao botao--fantasma', type: 'button', texto: 'Ver histórico',
        onclick: function () { ui.fecharPainel(); window.location.hash = '#/movimentos?codigo=' + encodeURIComponent(linha['Código']); }
      }),
      el('button', { class: 'botao botao--secundario', type: 'button', texto: 'Estoque mínimo', onclick: function () { definirMinimo(linha); } }),
      el('button', {
        class: 'botao', type: 'button', texto: 'Movimentar',
        onclick: function () {
          ui.fecharPainel();
          GPEL.telas.movimentos.novo({ 'Classe': linha['Classe'], 'Código Item': linha['Código'] });
        }
      })
    ]);
  }

  function cartao(linha) {
    return ui.cartao({
      titulo: linha['Item'] || linha['Código'],
      meta: linha['Classe'] + (linha['Unidade'] ? ' · ' + linha['Unidade'] : ''),
      selo: ui.selo(linha['Status']),
      linhas: [
        ['Saldo atual', ui.numero(linha['Saldo Atual'], 2)],
        ['Estoque mínimo', linha['Estoque Mín.'] === '' ? '—' : ui.numero(linha['Estoque Mín.'], 2)],
        ['Entradas / Saídas', ui.numero(linha['Entradas'], 2) + ' / ' + ui.numero(linha['Saídas'], 2)]
      ],
      aoClicar: function () { abrirDetalhe(linha); }
    });
  }

  return {
    titulo: 'Estoque',
    subtitulo: 'Saldo calculado pelas movimentações',
    acoes: function () {
      return [GPEL.recurso.botaoNovo('+ Movimentação', function () { GPEL.telas.movimentos.novo(); })];
    },
    render: function () {
      var linhas = registros();
      var repor = linhas.filter(precisaRepor).length;
      var semMinimo = linhas.filter(function (l) { return String(l['Status']) === 'DEFINIR MÍNIMO'; }).length;

      var resumo = el('div', { class: 'indicadores', style: 'margin-bottom:16px' }, [
        ui.indicador('Itens cadastrados', ui.numero(linhas.length, 0)),
        ui.indicador('Precisam de reposição', ui.numero(repor, 0), null, repor > 0),
        ui.indicador('Sem mínimo definido', ui.numero(semMinimo, 0)),
        ui.indicador('Movimentações', ui.numero(GPEL.estado.tabela('MOV_ESTOQUE').length, 0))
      ]);

      return el('div', {}, [
        resumo,
        GPEL.recurso.lista({
          registros: registros,
          vazio: 'Nenhum item no estoque ainda. Cadastre produtos e insumos em Administração.',
          placeholderBusca: 'Buscar item…',
          busca: function (l) { return (l['Item'] || '') + ' ' + (l['Código'] || ''); },
          filtros: [
            { rotulo: 'Todos', teste: null },
            { rotulo: 'Repor', teste: precisaRepor },
            { rotulo: 'Produtos', teste: function (l) { return l['Classe'] === 'Produto'; } },
            { rotulo: 'Insumos', teste: function (l) { return l['Classe'] === 'Insumo'; } }
          ],
          ordenar: function (a, b) {
            if (precisaRepor(a) !== precisaRepor(b)) return precisaRepor(a) ? -1 : 1;
            return String(a['Item']).localeCompare(String(b['Item']), 'pt-BR');
          },
          cartao: cartao,
          aoAbrir: abrirDetalhe,
          colunas: [
            { rotulo: 'Item', valor: function (l) { return l['Item'] || l['Código']; } },
            { rotulo: 'Classe', valor: function (l) { return l['Classe']; } },
            { rotulo: 'Unid.', valor: function (l) { return l['Unidade']; } },
            { rotulo: 'Entradas', numerico: true, valor: function (l) { return ui.numero(l['Entradas'], 2); } },
            { rotulo: 'Saídas', numerico: true, valor: function (l) { return ui.numero(l['Saídas'], 2); } },
            { rotulo: 'Saldo', numerico: true, valor: function (l) { return ui.numero(l['Saldo Atual'], 2); } },
            { rotulo: 'Mínimo', numerico: true, valor: function (l) { return l['Estoque Mín.'] === '' ? '—' : ui.numero(l['Estoque Mín.'], 2); } },
            { rotulo: 'Situação', valor: function (l) { return ui.selo(l['Status']); } }
          ]
        })
      ]);
    }
  };
})();

/* ===== js/telas/inventario.js ===== */
/* GPEL - Inventário.
   A divergência sozinha NUNCA muda o saldo. É preciso aprovar o ajuste,
   e a aprovação gera uma movimentação rastreável em MOV_ESTOQUE. */

window.GPEL = window.GPEL || {};
GPEL.telas = GPEL.telas || {};

GPEL.telas.inventario = (function () {
  var ui = GPEL.ui;
  var el = ui.el;
  var TABELA = 'INVENTARIO';

  var CAMPOS = [
    { nome: 'Data' },
    { nome: 'Classe' },
    { nome: 'Código', rotulo: 'Item' },
    { nome: 'Item' },
    { nome: 'Saldo Sistema', rotulo: 'Saldo no sistema' },
    { nome: 'Contagem Física', rotulo: 'Contagem física' },
    { nome: 'Diferença' },
    { nome: 'Responsável' },
    { nome: 'Observações' }
  ];

  function registros() { return GPEL.estado.tabela(TABELA); }

  function pendente(inventario) {
    return String(inventario['Ajuste?']) === 'Sim' && !inventario._ajusteAprovado;
  }

  function seloDe(inventario) {
    if (inventario._ajusteAprovado) return ui.selo('ajuste aprovado', 'ok');
    if (String(inventario['Ajuste?']) === 'Sim') return ui.selo('ajuste pendente', 'atencao');
    return ui.selo('sem divergência', 'neutro');
  }

  function novo(valoresIniciais) {
    GPEL.formulario.abrir({
      titulo: 'Nova contagem',
      tabela: TABELA,
      campos: CAMPOS,
      valores: Object.assign({ Data: ui.hoje(), 'Responsável': GPEL.api.usuario() }, valoresIniciais || {}),
      rotuloSalvar: 'Salvar contagem',
      extra: el('div', { class: 'aviso-configuracao', style: 'margin:0', texto: 'Salvar a contagem não altera o saldo. Se houver diferença, é preciso aprovar o ajuste depois.' }),
      aoSalvar: function (valores) {
        return GPEL.recurso.salvarNovo(TABELA, valores, 'Contagem registrada.');
      }
    });
  }

  function aprovar(inventario) {
    ui.fecharPainel();
    var diferenca = Number(inventario['Diferença']) || 0;
    ui.confirmar(
      'Aprovar ajuste',
      'Será criada uma movimentação de ' + (diferenca > 0 ? 'entrada' : 'saída') + ' de ' +
      ui.numero(Math.abs(diferenca), 2) + ' para "' + (inventario['Item'] || inventario['Código']) +
      '", deixando o saldo igual à contagem física. Essa movimentação fica registrada no histórico.',
      'Aprovar ajuste'
    ).then(function (confirmado) {
      if (!confirmado) return;
      ui.carregando(true);
      GPEL.api.aprovarAjuste(inventario['ID Inventário'])
        .then(function () {
          ui.aviso('Ajuste aprovado e estoque atualizado.', 'ok');
          return GPEL.estado.atualizar();
        })
        .catch(function (erro) { ui.aviso(erro.message, 'erro'); })
        .finally(function () { ui.carregando(false); });
    });
  }

  function abrirDetalhe(inventario) {
    var acoes = [];
    if (pendente(inventario)) {
      acoes.push(el('button', { class: 'botao', type: 'button', texto: 'Aprovar ajuste', onclick: function () { aprovar(inventario); } }));
    }
    acoes.push(el('button', {
      class: 'botao botao--fantasma', type: 'button', texto: 'Ver histórico do item',
      onclick: function () { ui.fecharPainel(); window.location.hash = '#/movimentos?codigo=' + encodeURIComponent(inventario['Código']); }
    }));

    GPEL.recurso.detalhe('Contagem', [
      ['Data', ui.data(inventario['Data'])],
      ['Item', inventario['Item'] || inventario['Código']],
      ['Classe', inventario['Classe']],
      ['Saldo no sistema (na contagem)', ui.numero(inventario['Saldo Sistema'], 2)],
      ['Saldo no sistema (agora)', ui.numero(GPEL.estado.saldoDe(inventario['Código']), 2)],
      ['Contagem física', ui.numero(inventario['Contagem Física'], 2)],
      ['Diferença', ui.numero(inventario['Diferença'], 2)],
      ['Responsável', inventario['Responsável'] || '—'],
      ['Observações', inventario['Observações'] || '—'],
      ['Situação', seloDe(inventario)]
    ], acoes);
  }

  function cartao(inventario) {
    return ui.cartao({
      titulo: inventario['Item'] || inventario['Código'],
      meta: ui.data(inventario['Data']) + ' · ' + (inventario['Responsável'] || 'sem responsável'),
      selo: seloDe(inventario),
      linhas: [
        ['Sistema', ui.numero(inventario['Saldo Sistema'], 2)],
        ['Contagem', ui.numero(inventario['Contagem Física'], 2)],
        ['Diferença', ui.numero(inventario['Diferença'], 2)]
      ],
      aoClicar: function () { abrirDetalhe(inventario); }
    });
  }

  return {
    titulo: 'Inventário',
    subtitulo: 'Contagem física e aprovação de ajustes',
    novo: novo,
    acoes: function () { return [GPEL.recurso.botaoNovo('+ Contagem', function () { novo(); })]; },
    render: function () {
      var pendentes = registros().filter(pendente).length;
      var alerta = pendentes
        ? el('div', { class: 'aviso-configuracao', texto: pendentes + (pendentes === 1 ? ' contagem está' : ' contagens estão') + ' com diferença aguardando aprovação de ajuste.' })
        : null;

      return el('div', {}, [
        alerta,
        GPEL.recurso.lista({
          registros: registros,
          vazio: 'Nenhuma contagem registrada.',
          placeholderBusca: 'Buscar item ou responsável…',
          busca: function (i) { return [i['Item'], i['Código'], i['Responsável']].join(' '); },
          filtros: [
            { rotulo: 'Todas', teste: null },
            { rotulo: 'Ajuste pendente', teste: pendente },
            { rotulo: 'Ajustadas', teste: function (i) { return !!i._ajusteAprovado; } },
            { rotulo: 'Sem diferença', teste: function (i) { return String(i['Ajuste?']) !== 'Sim'; } }
          ],
          ordenar: function (a, b) { return String(b['Data']).localeCompare(String(a['Data'])); },
          cartao: cartao,
          aoAbrir: abrirDetalhe,
          colunas: [
            { rotulo: 'Data', valor: function (i) { return ui.data(i['Data']); } },
            { rotulo: 'Item', valor: function (i) { return i['Item'] || i['Código']; } },
            { rotulo: 'Sistema', numerico: true, valor: function (i) { return ui.numero(i['Saldo Sistema'], 2); } },
            { rotulo: 'Contagem', numerico: true, valor: function (i) { return ui.numero(i['Contagem Física'], 2); } },

})();
